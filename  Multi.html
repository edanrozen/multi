<script>
/* ---- boot guard: silence the Tailwind dev notice + capture any load/runtime error
        so the app can never fail to a silent black screen ---- */
window.__bootErrors = [];
window.addEventListener('error', function(e){
  var t = e.target || {};
  if (t.src || t.href) window.__bootErrors.push('נכשלה טעינה של: ' + (t.src || t.href));
  else if (e.message) window.__bootErrors.push(e.message);
}, true);
(function(){
  var mute = ['cdn.tailwindcss.com','in-browser Babel','babeljs.io'];
  var filter = function(fn){ return function(){ var m = arguments[0];
    if (typeof m === 'string'){ for (var i=0;i<mute.length;i++){ if (m.indexOf(mute[i]) > -1) return; } }
    return fn.apply(console, arguments); }; };
  console.warn = filter(console.warn);
  console.log  = filter(console.log);
})();
window.addEventListener('load', function(){
  setTimeout(function(){
    var root = document.getElementById('root');
    if (!root || root.getAttribute('data-mounted') === '1') return;
    var miss = [];
    if (!window.React) miss.push('React');
    if (!window.ReactDOM) miss.push('ReactDOM');
    if (!window.Babel) miss.push('Babel');
    if (!window.QRCode) miss.push('QRCode');
    if (typeof window.XLSX === 'undefined') miss.push('XLSX');
    if (miss.length === 0 && window.__bootErrors.length === 0) return;
    root.innerHTML =
      '<div dir="rtl" style="max-width:540px;margin:12vh auto;padding:26px;font-family:Heebo,Arial,sans-serif;'
      + 'color:#eaeefb;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:22px;line-height:1.75">'
      + '<h2 style="margin:0 0 10px;font-size:20px">האפליקציה לא נטענה במלואה</h2>'
      + (miss.length ? '<p>ספריות שלא נטענו מהרשת: <b style="color:#fcd34d">' + miss.join(', ') + '</b></p>' : '')
      + (window.__bootErrors.length ? '<pre style="white-space:pre-wrap;font-size:12px;color:#fca5a5;margin:8px 0 0">' + window.__bootErrors.join('\n') + '</pre>' : '')
      + '<p style="font-size:13px;color:#9aa6bd;margin-top:14px">כמעט תמיד זה אומר שהרשת חוסמת גישה לשרת חיצוני. '
      + 'צלם/י מסך של ההודעה הזו ושלח/י לי — זה מראה בדיוק מה חסום ואני מתקן בהתאם.</p></div>';
  }, 4000);
});
</script>

<style>
:root{
  --bg0:#05070e; --brass:#e7b84b; --brass2:#c99a2e; --cyan:#5cc8ff;
  --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.18);
  --text:#eaeefb; --muted:#9aa6bd; --muted2:#6b7688;
  --px:0; --py:0;
}
*{ -webkit-tap-highlight-color:transparent }
html,body,#root{height:100%}
body{
  font-family:'Heebo',system-ui,sans-serif; color:var(--text); background:var(--bg0);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden;
}
.num{font-family:'Rubik','Heebo',sans-serif; font-feature-settings:"tnum"; letter-spacing:-.02em}

/* ambient background */
.ambient{position:fixed; inset:0; z-index:-2; overflow:hidden; pointer-events:none;
  background:
   radial-gradient(1200px 820px at 84% -12%, rgba(84,62,150,.42), transparent 60%),
   radial-gradient(1000px 720px at 6% 10%, rgba(14,96,140,.34), transparent 55%),
   radial-gradient(920px 900px at 58% 122%, rgba(201,154,46,.16), transparent 60%),
   linear-gradient(180deg,#070b17,#05070e 70%);
}
.layer{position:absolute; inset:0; will-change:transform}
.l1{transform:translate3d(calc(var(--px)*22px),calc(var(--py)*22px),0)}
.l2{transform:translate3d(calc(var(--px)*-30px),calc(var(--py)*18px),0)}
.l3{transform:translate3d(calc(var(--px)*16px),calc(var(--py)*-15px),0)}
.blob{position:absolute; border-radius:50%; filter:blur(72px); opacity:.5; mix-blend-mode:screen; will-change:transform}
.b1{width:48vw;height:48vw;left:-8vw;top:-12vw;background:radial-gradient(circle,#4a4fb0,transparent 70%);animation:drift 20s ease-in-out infinite}
.b2{width:42vw;height:42vw;right:-6vw;top:4vh;background:radial-gradient(circle,#0f78ad,transparent 70%);animation:drift 25s ease-in-out -6s infinite}
.b3{width:40vw;height:40vw;left:22vw;bottom:-18vw;background:radial-gradient(circle,#c39433,transparent 70%);opacity:.34;animation:drift 30s ease-in-out -14s infinite}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,-4%,0) scale(1.05)}}
.ambient-grid{position:absolute; inset:0; opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% 28%, #000, transparent 78%);
  mask-image:radial-gradient(circle at 50% 28%, #000, transparent 78%);
}

/* glass surfaces */
.card{
  position:relative;
  background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.028));
  border:1px solid var(--stroke); border-radius:22px;
  box-shadow:0 1px 0 0 rgba(255,255,255,.07) inset, 0 16px 44px -18px rgba(0,0,0,.62), 0 3px 10px -6px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(18px) saturate(140%); backdrop-filter:blur(18px) saturate(140%);
}
.lift{transition:box-shadow .28s ease, border-color .28s ease}
.lift:hover{box-shadow:0 1px 0 0 rgba(255,255,255,.09) inset, 0 26px 60px -20px rgba(0,0,0,.72); border-color:var(--stroke2)}
.glass-modal{
  background:linear-gradient(180deg, rgba(24,29,44,.9), rgba(13,17,29,.94));
  border:1px solid var(--stroke2); border-radius:28px;
  box-shadow:0 40px 100px -24px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.08) inset;
  -webkit-backdrop-filter:blur(28px) saturate(150%); backdrop-filter:blur(28px) saturate(150%);
}
.hairline{background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent); height:1px}

/* inputs */
.input{
  width:100%; background:rgba(255,255,255,.045); border:1px solid var(--stroke);
  border-radius:14px; padding:.7rem .9rem; font-size:.9rem; color:var(--text);
  outline:none; transition:border-color .18s, box-shadow .18s, background .18s;
}
.input::placeholder{color:var(--muted2)}
.input:focus{border-color:rgba(231,184,75,.6); box-shadow:0 0 0 4px rgba(231,184,75,.15); background:rgba(255,255,255,.07)}
select.input option{color:#0b1220}
input[type=date].input, input[type=time].input{color-scheme:dark}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:14px;
  padding:.64rem 1.05rem; font-size:.9rem; font-weight:600; cursor:pointer; white-space:nowrap;
  transition:transform .12s cubic-bezier(.2,.8,.3,1.5), box-shadow .22s, background .2s, opacity .2s, border-color .2s;}
.btn:active{transform:scale(.955)}
.btn:disabled{opacity:.5; cursor:default}
.btn-brass{background:linear-gradient(180deg,#f3cb63,#c99a2e); color:#1b1405;
  box-shadow:0 10px 26px -10px rgba(231,184,75,.65), 0 1px 0 rgba(255,255,255,.45) inset}
.btn-brass:hover{box-shadow:0 14px 34px -10px rgba(231,184,75,.8), 0 1px 0 rgba(255,255,255,.55) inset}
.btn-glass{background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--stroke2)}
.btn-glass:hover{background:rgba(255,255,255,.14)}
.btn-outline{background:transparent; border:1px solid var(--stroke2); color:var(--text)}
.btn-outline:hover{background:rgba(255,255,255,.06)}
.btn-ghost{background:transparent; color:var(--muted)}
.btn-ghost:hover{background:rgba(255,255,255,.06); color:var(--text)}
.btn-danger{background:linear-gradient(180deg,#fb7185,#e11d48); color:#fff; box-shadow:0 10px 26px -10px rgba(225,29,72,.6)}

/* chips */
.chip{display:inline-block; border-radius:999px; border:1px solid; padding:.15rem .6rem; font-size:.72rem; font-weight:600; backdrop-filter:blur(4px)}

/* 3D tilt */
.tilt{transition:transform .3s cubic-bezier(.2,.8,.3,1); transform-style:preserve-3d; will-change:transform}

/* skeleton */
.skeleton{position:relative; overflow:hidden; background:rgba(255,255,255,.055); border-radius:12px}
.skeleton::after{content:""; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent); animation:sheen 1.5s infinite}
@keyframes sheen{100%{transform:translateX(100%)}}

/* entrances */
.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
.pop{animation:pop .36s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{opacity:0; transform:scale(.94) translateY(10px)}to{opacity:1; transform:none}}
.stagger>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.stagger>*:nth-child(1){animation-delay:.03s}
.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.13s}
.stagger>*:nth-child(4){animation-delay:.18s}
.stagger>*:nth-child(5){animation-delay:.23s}
.stagger>*:nth-child(6){animation-delay:.28s}
.stagger>*:nth-child(7){animation-delay:.33s}
.stagger>*:nth-child(8){animation-delay:.38s}

/* signing surface stays light for printed PDF */
.signpad{touch-action:none; background:
  linear-gradient(#dbe2ec 1px,transparent 1px) 0 100%/100% 34px; background-color:#fff}

/* scrollbars */
*{scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.2) transparent}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16); border-radius:10px; border:2px solid transparent; background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28); background-clip:padding-box}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important}
  .layer{transform:none !important}
}
/* lighter on small screens for performance */
@media (max-width:768px){
  .card{-webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px)}
  .blob{filter:blur(56px)}
}

/* print: certificate only, on white */
#print-area{display:none}
@media print{
  body{background:#fff}
  .ambient{display:none !important}
  #app-root{display:none !important}
  #print-area{display:block !important}
  @page{margin:16mm}
}
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

/* =====================================================================
   CONFIG — paste your Supabase project values here (Settings -> API)
   ===================================================================== */
const SUPABASE_URL = "";       // fill later to switch from demo to a real database
const SUPABASE_ANON_KEY = "";  // the public anon key

/* =====================================================================
   DEMO BACKEND — runs with zero database. Realistic in-memory data,
   every screen and button works, and NOTHING persists: refresh = reset.
   When SUPABASE_URL + SUPABASE_ANON_KEY are filled (and supabase-js is
   loaded) the app automatically uses the real backend instead.
   ===================================================================== */
function makeDemoClient(){
  const now = () => new Date().toISOString();
  const uid = (p='id') => p+'-'+Math.random().toString(36).slice(2,9);
  const dAgo = n => new Date(Date.now()-n*864e5).toISOString();
  const S = {
    profiles: [
      {id:'me', full_name:'מנהל הדגמה',    unit:'מדור מולטימדיה', role:'admin',             created_at:dAgo(120)},
      {id:'u2', full_name:'רס״ל דנה כהן',  unit:'מדור מולטימדיה', role:'equipment_manager', created_at:dAgo(80)},
      {id:'u3', full_name:'סמל יואב לוי',  unit:'פלוגה א׳',        role:'user',              created_at:dAgo(30)},
    ],
    categories: ['מצלמות','עדשות','תאורה','אודיו','חצובות','ייצוב','רחפנים','אביזרים'].map((n,i)=>({id:'c'+(i+1),name:n})),
    equipment: [], borrows: [], borrow_items: [], returns: [], audit_log: [],
  };
  const catId = n => (S.categories.find(c=>c.name===n)||{}).id;
  const mkEq = (name,c,serial,asset,man,model,price,status,ago)=>({
    id:uid('eq'), name, category_id:catId(c), serial_number:serial, asset_number:asset,
    manufacturer:man, model, price, location:'ארון ציוד 3', notes:'', status, image_url:null,
    purchase_date:dAgo((ago||100)+220).slice(0,10), warranty_expiry:dAgo(-420).slice(0,10), created_at:dAgo(ago||100),
  });
  S.equipment = [
    mkEq('Sony FX6','מצלמות','SN-FX6-0421','A-1001','Sony','ILME-FX6',34000,'available',3),
    mkEq('Canon EOS R5','מצלמות','SN-R5-1180','A-1002','Canon','EOS R5',15000,'available',42),
    mkEq('עדשת RF 24-70 F2.8','עדשות','SN-2470-338','A-1003','Canon','RF 24-70mm',9000,'borrowed',60),
    mkEq('Aputure LS 600d','תאורה','SN-600D-091','A-1004','Aputure','LS 600d Pro',7000,'available',75),
    mkEq('Rode Wireless GO II','אודיו','SN-RODE-552','A-1005','Rode','Wireless GO II',1200,'borrowed',20),
    mkEq('חצובת Manfrotto 504X','חצובות','SN-504X-207','A-1006','Manfrotto','Nitrotech 504X',3500,'available',90),
    mkEq('Atomos Ninja V','אביזרים','SN-NJV-746','A-1007','Atomos','Ninja V',2800,'faulty',110),
    mkEq('רחפן DJI Mavic 3','רחפנים','SN-MAV3-014','A-1008','DJI','Mavic 3 Cine',12000,'available',15),
  ];
  const mkBorrow = (name,pn,unit,phone,eqName,agoOut,retInDays,status)=>{
    const id=uid('b'); const e=S.equipment.find(x=>x.name===eqName);
    S.borrows.push({id, full_name:name, personal_number:pn, unit, phone, purpose:'צילום פעילות יחידתית',
      checkout_date:dAgo(agoOut).slice(0,10), checkout_time:'09:00',
      expected_return_date:dAgo(-retInDays).slice(0,10), expected_return_time:'17:00',
      status, actual_return_at:null, signature_path:null, created_at:dAgo(agoOut)});
    if(e) S.borrow_items.push({id:uid('bi'), borrow_id:id, equipment_id:e.id, quantity:1});
    return id;
  };
  const b1 = mkBorrow('סמל יואב לוי','8123456','פלוגה א׳','050-1234567','עדשת RF 24-70 F2.8',5,3,'active');
  mkBorrow('רב״ט מאיה בר','8987654','פלוגה ב׳','052-7654321','Rode Wireless GO II',9,-2,'overdue');
  S.audit_log = [
    {id:uid('a'),action:'INSERT',entity_type:'equipment',entity_id:S.equipment[0].id,actor_name:'מנהל הדגמה',created_at:dAgo(3)},
    {id:uid('a'),action:'BORROW',entity_type:'borrows',entity_id:b1,actor_name:'רס״ל דנה כהן',created_at:dAgo(5)},
    {id:uid('a'),action:'UPDATE',entity_type:'equipment',entity_id:S.equipment[6].id,actor_name:'מנהל הדגמה',created_at:dAgo(2)},
  ];
  const blobs = {};
  const clone = r => ({...r});
  const catOf = id => { const c=S.categories.find(c=>c.id===id); return c?{name:c.name}:null; };
  const itemsOf = bid => S.borrow_items.filter(bi=>bi.borrow_id===bid).map(bi=>{
    const e=S.equipment.find(x=>x.id===bi.equipment_id)||{};
    return {quantity:bi.quantity, equipment:{name:e.name, serial_number:e.serial_number}};
  });
  function run(q){
    const tbl = S[q.table] || [];
    if(q._op==='insert'){
      const arr = Array.isArray(q._payload)?q._payload:[q._payload];
      const ins = arr.map(p=>{ const r={id:uid(q.table.slice(0,2)), created_at:now(), ...p}; tbl.push(r); return r; });
      return {data:ins, error:null};
    }
    if(q._op==='update'){
      const rows = tbl.filter(r=>q.filters.every(f=>f(r)));
      rows.forEach(r=>Object.assign(r,q._payload));
      return {data:rows.map(clone), error:null};
    }
    if(q._op==='delete'){
      const keep=[], del=[]; tbl.forEach(r=>(q.filters.every(f=>f(r))?del:keep).push(r));
      S[q.table]=keep; return {data:del, error:null};
    }
    let rows = tbl.filter(r=>q.filters.every(f=>f(r)));
    if(q._order){ const {c,asc}=q._order; rows=[...rows].sort((a,b)=>{ const x=a[c]??'', y=b[c]??''; return x===y?0:(x>y?1:-1)*(asc?1:-1); }); }
    const count = rows.length;
    if(q._limit!=null) rows = rows.slice(0,q._limit);
    if(q._head) return {data:null, count, error:null};
    rows = rows.map(clone);
    if(q.table==='equipment' && /category:/.test(q.cols)) rows.forEach(r=>r.category=catOf(r.category_id));
    if(q.table==='borrows'  && /borrow_items/.test(q.cols)) rows.forEach(r=>r.borrow_items=itemsOf(r.id));
    if(q._single) return {data:rows[0]||null, count, error:null};
    return {data:rows, count, error:null};
  }
  function QB(table){
    return {
      table, cols:'*', filters:[], _order:null, _limit:null, _single:false, _head:false, _op:'select', _payload:null,
      select(c,o){ this.cols=c||'*'; if(o&&o.head)this._head=true; return this; },
      eq(c,v){ this.filters.push(r=>r[c]===v); return this; },
      neq(c,v){ this.filters.push(r=>r[c]!==v); return this; },
      in(c,a){ this.filters.push(r=>a.indexOf(r[c])>-1); return this; },
      gte(c,v){ this.filters.push(r=>((r[c]??'')>=v)); return this; },
      lte(c,v){ this.filters.push(r=>((r[c]??'')<=v)); return this; },
      gt(c,v){ this.filters.push(r=>((r[c]??'')>v)); return this; },
      lt(c,v){ this.filters.push(r=>((r[c]??'')<v)); return this; },
      order(c,o){ this._order={c,asc:!o||o.ascending!==false}; return this; },
      limit(n){ this._limit=n; return this; },
      single(){ this._single=true; return this; },
      insert(p){ this._op='insert'; this._payload=p; return this; },
      update(p){ this._op='update'; this._payload=p; return this; },
      delete(){ this._op='delete'; return this; },
      then(res){ try{ res(run(this)); }catch(e){ res({data:null,error:{message:String(e&&e.message||e)}}); } },
    };
  }
  function rpc(name,p){ return { then(res){ try{ res(runRpc(name,p)); }catch(e){ res({data:null,error:{message:String(e&&e.message||e)}}); } } }; }
  function runRpc(name,p){
    if(name==='create_borrow'){
      const id=uid('b');
      S.borrows.push({id, full_name:p.p_full_name, personal_number:p.p_personal_number, unit:p.p_unit, phone:p.p_phone,
        purpose:p.p_purpose, checkout_date:p.p_checkout_date, checkout_time:p.p_checkout_time,
        expected_return_date:p.p_expected_return_date, expected_return_time:p.p_expected_return_time,
        status:'active', actual_return_at:null, signature_path:p.p_signature_path, created_at:now()});
      (p.p_items||[]).forEach(it=>{ S.borrow_items.push({id:uid('bi'), borrow_id:id, equipment_id:it.equipment_id, quantity:it.quantity});
        const e=S.equipment.find(x=>x.id===it.equipment_id); if(e) e.status='borrowed'; });
      S.audit_log.unshift({id:uid('a'),action:'BORROW',entity_type:'borrows',entity_id:id,actor_name:'מנהל הדגמה',created_at:now()});
      return {data:id, error:null};
    }
    if(name==='process_return'){
      const b=S.borrows.find(x=>x.id===p.p_borrow_id); if(b){ b.status='returned'; b.actual_return_at=now(); }
      S.borrow_items.filter(bi=>bi.borrow_id===p.p_borrow_id).forEach(bi=>{ const e=S.equipment.find(x=>x.id===bi.equipment_id);
        if(e) e.status = p.p_condition==='major_damage' ? 'faulty' : 'available'; });

/* ===== motion hooks ===== */
function useCountUp(target){
  const [v,setV] = useState(reduced()?target:0);
  useEffect(()=>{
    if(reduced()){ setV(target); return; }
    let raf, start; const dur=900, from=0;
    const tick = t => { if(!start) start=t; const p=Math.min(1,(t-start)/dur);
      const e=1-Math.pow(1-p,3); setV(Math.round(from+(target-from)*e));
      if(p<1) raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf);
  },[target]);
  return v;
}
function useAmbientParallax(){
  useEffect(()=>{
    if(reduced() || !fine()) return;
    let raf=0, tx=0, ty=0;
    const move = e => { tx=(e.clientX/window.innerWidth-.5)*2; ty=(e.clientY/window.innerHeight-.5)*2;
      if(!raf) raf=requestAnimationFrame(()=>{ const r=document.documentElement.style;
        r.setProperty('--px',tx.toFixed(3)); r.setProperty('--py',ty.toFixed(3)); raf=0; }); };
    window.addEventListener('mousemove',move,{passive:true});
    return ()=>window.removeEventListener('mousemove',move);
  },[]);
}
function Tilt({children,max=8,className=''}){
  const inner = useRef();
  const on = e => { if(!fine()||!inner.current) return; const r=inner.current.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    inner.current.style.transform = `rotateX(${(-y*max).toFixed(2)}deg) rotateY(${(x*max).toFixed(2)}deg)`; };
  const off = () => { if(inner.current) inner.current.style.transform=''; };
  return <div style={{perspective:'900px'}} onMouseMove={on} onMouseLeave={off}>
    <div ref={inner} className={cx('tilt',className)}>{children}</div></div>;
}

  };

}

   Signature pad (logic unchanged; white surface for print fidelity)
   ===================================================================== */
function SignaturePad({onChange}){
  const ref = useRef(); const drawing = useRef(false); const last = useRef(null);
  useEffect(()=>{
    const c = ref.current, dpr = window.devicePixelRatio||1;
    const w = c.clientWidth, h = c.clientHeight;
    c.width = w*dpr; c.height = h*dpr;
    const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
    ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.strokeStyle='#0b1220';
  },[]);
  const pos = e => { const r = ref.current.getBoundingClientRect(); const p = e.touches?e.touches[0]:e; return {x:p.clientX-r.left, y:p.clientY-r.top}; };
  const start = e => { e.preventDefault(); drawing.current=true; last.current=pos(e); };
  const move  = e => { if(!drawing.current) return; e.preventDefault(); const ctx = ref.current.getContext('2d'), p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.current.x,last.current.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last.current=p; };
  const end = () => { if(drawing.current){drawing.current=false; onChange(ref.current.toDataURL('image/png'));} };
  const clear = () => { const c=ref.current; c.getContext('2d').clearRect(0,0,c.width,c.height); onChange(null); };
  return (
    <div>
      <canvas ref={ref} className="signpad h-40 w-full cursor-crosshair rounded-2xl border border-white/25 shadow-inner"
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}/>
      <div className="mt-2 flex justify-between text-xs text-slate-500">
        <span>חתום/חתמי באצבע או בעכבר</span>
        <button type="button" onClick={clear} className="font-medium text-slate-400 transition hover:text-rose-400">נקה חתימה</button>
      </div>
    </div>
  );
}

function EquipmentForm({item,categories,onSaved,onClose}){
  const toast = useToast();
  const empty = {name:'',category_id:'',serial_number:'',asset_number:'',manufacturer:'',model:'',price:'',purchase_date:'',warranty_expiry:'',location:'',notes:'',status:'available',image_url:''};
  const [f,setF] = useState(item?{...empty,...item,category_id:item.category_id||''}:empty);
  const [busy,setBusy] = useState(false);
  const set = (k,v)=>setF(x=>({...x,[k]:v}));
  const upload = async e => {
    const file = e.target.files?.[0]; if(!file) return;
    setBusy(true);
    const path = `${crypto.randomUUID()}.${file.name.split('.').pop()}`;
    const {error} = await sb.storage.from('equipment-images').upload(path,file,{upsert:true});
    if(error){ toast('העלאת תמונה נכשלה','error'); setBusy(false); return; }
    const {data} = sb.storage.from('equipment-images').getPublicUrl(path);
    set('image_url',data.publicUrl); setBusy(false); toast('תמונה הועלתה','success');
  };
  const save = async () => {
    if(!f.name.trim()) return toast('שם ציוד הוא שדה חובה','error');
    setBusy(true);
    const payload = {...f,
      category_id:f.category_id||null, price:f.price===''?null:Number(f.price),
      purchase_date:f.purchase_date||null, warranty_expiry:f.warranty_expiry||null};
    delete payload.category;
    let error;
    if(item?.id){ delete payload.id; delete payload.created_at; delete payload.updated_at;
      ({error} = await sb.from('equipment').update(payload).eq('id',item.id)); }
    else ({error} = await sb.from('equipment').insert(payload));
    setBusy(false);
    if(error) return toast('שגיאה בשמירה: '+(error.message.includes('duplicate')?'מספר סידורי/נכס כבר קיים':error.message),'error');
    toast(item?'הציוד עודכן':'הציוד נוסף','success'); onSaved();
  };
  return (
    <div className="space-y-4">
      <div className="grid gap-4 sm:grid-cols-2">
        <Field label="שם" required><Input value={f.name} onChange={e=>set('name',e.target.value)}/></Field>
        <Field label="קטגוריה"><Select value={f.category_id} onChange={e=>set('category_id',e.target.value)}>
          <option value="">— ללא —</option>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</Select></Field>
        <Field label="מספר סידורי"><Input dir="ltr" value={f.serial_number||''} onChange={e=>set('serial_number',e.target.value)}/></Field>
        <Field label="מספר נכס"><Input dir="ltr" value={f.asset_number||''} onChange={e=>set('asset_number',e.target.value)}/></Field>
        <Field label="יצרן"><Input value={f.manufacturer||''} onChange={e=>set('manufacturer',e.target.value)}/></Field>
        <Field label="דגם"><Input value={f.model||''} onChange={e=>set('model',e.target.value)}/></Field>
        <Field label="מחיר (₪)"><Input type="number" dir="ltr" value={f.price??''} onChange={e=>set('price',e.target.value)}/></Field>
        <Field label="מיקום"><Input value={f.location||''} onChange={e=>set('location',e.target.value)}/></Field>
        <Field label="תאריך רכישה"><Input type="date" value={f.purchase_date||''} onChange={e=>set('purchase_date',e.target.value)}/></Field>
        <Field label="תום אחריות"><Input type="date" value={f.warranty_expiry||''} onChange={e=>set('warranty_expiry',e.target.value)}/></Field>
        <Field label="סטטוס"><Select value={f.status} onChange={e=>set('status',e.target.value)}>
          {Object.entries(EQ_STATUS).map(([k,v])=><option key={k} value={k}>{v.he}</option>)}</Select></Field>
        <Field label="תמונה"><input type="file" accept="image/*" onChange={upload} className="w-full text-sm text-slate-300 file:mr-3 file:rounded-lg file:border-0 file:bg-white/10 file:px-3 file:py-2 file:text-slate-200"/></Field>
      </div>
      {f.image_url && <img src={f.image_url} className="h-28 rounded-xl border border-white/15 object-cover"/>}
      <Field label="הערות"><Area value={f.notes||''} onChange={e=>set('notes',e.target.value)}/></Field>
      <div className="flex justify-end gap-2 pt-2">
        <Btn variant="ghost" onClick={onClose}>ביטול</Btn>
        <Btn variant="brass" onClick={save} disabled={busy}>{busy?'שומר…':'שמירה'}</Btn>
      </div>
    </div>
  );
}

function Equipment({initialFilter}){
  const {isStaff} = useAuth(); const toast = useToast();
  const [rows,setRows] = useState(null);
  const [cats,setCats] = useState([]);
  const [q,setQ] = useState(''); const [status,setStatus] = useState(initialFilter||'');
  const [cat,setCat] = useState('');
  const [editing,setEditing] = useState(null);
  const [detail,setDetail] = useState(null); const [hist,setHist] = useState(null);
  const load = useCallback(async ()=>{
    setRows(null);
    const [{data:eq},{data:c}] = await Promise.all([db.equipment(),db.categories()]);
    setRows(eq||[]); setCats(c||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  useEffect(()=>{setStatus(initialFilter||'');},[initialFilter]);
  const openDetail = async item => {
    setDetail(item); setHist(null);
    const {data} = await sb.from('audit_log').select('*').eq('entity_type','equipment').eq('entity_id',item.id).order('created_at',{ascending:false}).limit(20);
    setHist(data||[]);
  };
  const del = async item => {
    if(!confirm(`למחוק את "${item.name}"? פעולה זו אינה הפיכה.`)) return;
    const {error} = await sb.from('equipment').delete().eq('id',item.id);
    if(error) return toast('לא ניתן למחוק (ייתכן שהפריט מקושר להשאלה)','error');
    toast('הציוד נמחק','success'); load();
  };
  const filtered = useMemo(()=>{
    if(!rows) return [];
    const term = q.trim().toLowerCase();
    return rows.filter(r=>{
      if(status && r.status!==status) return false;
      if(cat && r.category_id!==cat) return false;
      if(term && !([r.name,r.serial_number,r.asset_number,r.manufacturer,r.model].join(' ').toLowerCase().includes(term))) return false;
      return true;
    });
  },[rows,q,status,cat]);
  const exportXlsx = () => {
    const data = filtered.map(r=>({'שם':r.name,'קטגוריה':r.category?.name||'',"מס' סידורי":r.serial_number||'',"מס' נכס":r.asset_number||'',
      'יצרן':r.manufacturer||'','דגם':r.model||'','מחיר':r.price||'','מיקום':r.location||'','סטטוס':EQ_STATUS[r.status]?.he||r.status}));
    const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'ציוד'); XLSX.writeFile(wb,`ציוד_${todayISO()}.xlsx`);
  };
  return (
    <div className="space-y-4">
      <div className="card flex flex-col gap-3 p-4 sm:flex-row sm:items-center">
        <div className="relative flex-1">
          <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-500"><IconSearch size={18}/></span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="חיפוש לפי שם, מספר סידורי, נכס…" className="input pr-10"/>
        </div>
        <Select value={status} onChange={e=>setStatus(e.target.value)}>
          <option value="">כל הסטטוסים</option>{Object.entries(EQ_STATUS).map(([k,v])=><option key={k} value={k}>{v.he}</option>)}</Select>
        <Select value={cat} onChange={e=>setCat(e.target.value)}>
          <option value="">כל הקטגוריות</option>{cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</Select>
        <Btn variant="outline" onClick={exportXlsx}><IconExcel size={16}/> ייצוא</Btn>
        {isStaff && <Btn variant="brass" onClick={()=>setEditing({})}><IconPlus size={16}/> ציוד חדש</Btn>}
      </div>

      {rows===null ? <CardsSkeleton/> :
       filtered.length===0 ? <Empty icon={<IconBox size={48}/>} title="לא נמצא ציוד" sub="נסה לשנות את החיפוש או המסננים, או הוסף פריט חדש."/> :
       <div className="stagger grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
         {filtered.map(r=>(
           <Tilt key={r.id} max={6}>
             <div className="card lift group overflow-hidden">
               <button onClick={()=>openDetail(r)} className="block w-full text-right">
                 <div className="relative h-32 w-full bg-white/5">
                   {r.image_url ? <img src={r.image_url} className="h-full w-full object-cover"/> :
                     <div className="flex h-full items-center justify-center text-slate-600"><IconBox size={40}/></div>}
                   <div className="absolute left-2 top-2"><Badge map={EQ_STATUS} value={r.status}/></div>
                 </div>
                 <div className="p-3">
                   <div className="truncate font-semibold text-white">{r.name}</div>
                   <div className="truncate text-xs text-slate-400">{r.manufacturer} {r.model||''} · {r.category?.name||'—'}</div>
                   <div className="num mt-1 text-[11px] text-slate-500">{r.asset_number||r.serial_number||'ללא מספר'}</div>
                 </div>
               </button>
               {isStaff &&
                 <div className="flex border-t border-white/10">
                   <button onClick={()=>setEditing(r)} className="flex flex-1 items-center justify-center gap-1 py-2 text-xs text-slate-300 transition hover:bg-white/5"><IconEdit size={14}/> עריכה</button>
                   <button onClick={()=>del(r)} className="flex flex-1 items-center justify-center gap-1 border-r border-white/10 py-2 text-xs text-rose-300 transition hover:bg-rose-500/10"><IconTrash size={14}/> מחיקה</button>
                 </div>}
             </div>
           </Tilt>
         ))}
       </div>}

      <Modal open={!!editing} onClose={()=>setEditing(null)} wide title={editing?.id?'עריכת ציוד':'הוספת ציוד'}>
        {editing && <EquipmentForm item={editing.id?editing:null} categories={cats} onClose={()=>setEditing(null)} onSaved={()=>{setEditing(null);load();}}/>}
      </Modal>
      <Modal open={!!detail} onClose={()=>setDetail(null)} wide title="פרטי ציוד">
        {detail && <EquipmentDetail item={detail} history={hist} onClose={()=>setDetail(null)}/>}
      </Modal>
    </div>
  );
}

      להשתמש בו למטרה שצוינה בלבד ולהחזירו במועד ובמצב שבו נמסר. ידוע לי כי אני נושא/ת באחריות מלאה לציוד עד להחזרתו ואישורה.
    </div>

}
function Borrow({onDone}){
  const toast = useToast();
  const [avail,setAvail] = useState(null);
  const [picked,setPicked] = useState([]);
  const [q,setQ] = useState('');
  const [f,setF] = useState({full_name:'',personal_number:'',unit:'',phone:'',purpose:'',
    checkout_date:todayISO(),checkout_time:nowTime(),expected_return_date:'',expected_return_time:''});
  const [sig,setSig] = useState(null); const [agree,setAgree] = useState(false);
  const [busy,setBusy] = useState(false); const [done,setDone] = useState(null);
  const set = (k,v)=>setF(x=>({...x,[k]:v}));
  useEffect(()=>{ db.available().then(({data})=>setAvail(data||[])); },[]);
  const add = it => { if(picked.find(p=>p.id===it.id)) return; setPicked(p=>[...p,{...it,quantity:1}]); };
  const remove = id => setPicked(p=>p.filter(x=>x.id!==id));
  const results = useMemo(()=>{
    if(!avail) return [];
    const t = q.trim().toLowerCase();
    return avail.filter(a=>!picked.find(p=>p.id===a.id) &&
      (!t || [a.name,a.serial_number,a.asset_number].join(' ').toLowerCase().includes(t))).slice(0,8);
  },[avail,q,picked]);
  const submit = async () => {
    if(!f.full_name.trim()) return toast('שם מלא הוא שדה חובה','error');
    if(!f.expected_return_date) return toast('נא לבחור תאריך החזרה','error');
    if(picked.length===0) return toast('נא לבחור לפחות פריט אחד','error');
    if(!agree) return toast('נא לאשר את ההצהרה','error');
    if(!sig) return toast('נדרשת חתימה','error');
    setBusy(true);
    let sigPath = null;
    try {
      const blob = await (await fetch(sig)).blob();
      const path = `sig-${Date.now()}.png`;
      const {error:se} = await sb.storage.from('signatures').upload(path,blob,{contentType:'image/png'});
      if(!se) sigPath = path;
    } catch(_) {}
    const {data,error} = await sb.rpc('create_borrow',{
      p_full_name:f.full_name.trim(), p_personal_number:f.personal_number||null, p_unit:f.unit||null,
      p_phone:f.phone||null, p_purpose:f.purpose||null,
      p_checkout_date:f.checkout_date, p_checkout_time:f.checkout_time||null,
      p_expected_return_date:f.expected_return_date, p_expected_return_time:f.expected_return_time||null,
      p_signature_path:sigPath,
      p_items:picked.map(p=>({equipment_id:p.id,quantity:p.quantity})),
    });
    setBusy(false);
    if(error) return toast('שגיאה: '+error.message,'error');
    toast('ההשאלה נרשמה בהצלחה','success');
    setDone({borrow:{...f,id:data}, items:picked, sig});
  };
  const printCert = () => {
    if(!done) return;
    document.getElementById('print-area').innerHTML = buildCertificate(done.borrow,done.items,done.sig);
    window.print();
  };
  if(done){
    return (
      <div className="mx-auto max-w-lg">
        <div className="card pop p-6 text-center">
          <div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-3xl bg-emerald-400/15 text-emerald-300 ring-1 ring-emerald-400/30"><IconIn size={32}/></div>
          <h2 className="text-xl font-bold text-white">ההשאלה נרשמה</h2>
          <p className="mt-1 text-sm text-slate-400">מס' השאלה <b className="num text-slate-100">{done.borrow.id.slice(0,8).toUpperCase()}</b></p>
          <div className="my-5 flex justify-center"><QR text={done.borrow.id} size={132}/></div>
          <p className="text-sm text-slate-400">{done.items.length} פריטים · {done.borrow.full_name}</p>
          <div className="mt-6 flex flex-col gap-2">
            <Btn variant="brass" onClick={printCert}><IconLog size={16}/> הפקת טופס PDF / הדפסה</Btn>
            <Btn variant="outline" onClick={()=>{setDone(null);setPicked([]);setSig(null);setAgree(false);setF({full_name:'',personal_number:'',unit:'',phone:'',purpose:'',checkout_date:todayISO(),checkout_time:nowTime(),expected_return_date:'',expected_return_time:''});db.available().then(({data})=>setAvail(data||[]));}}>השאלה נוספת</Btn>
            <Btn variant="ghost" onClick={onDone}>חזרה ללוח הבקרה</Btn>
          </div>
        </div>
      </div>
    );
  }
  return (
    <div className="grid gap-5 lg:grid-cols-3">
      <div className="space-y-5 lg:col-span-2">
        <div className="card p-5">
          <h3 className="mb-4 font-bold text-white">פרטי המשאיל/ה</h3>
          <div className="grid gap-4 sm:grid-cols-2">
            <Field label="שם מלא" required><Input value={f.full_name} onChange={e=>set('full_name',e.target.value)}/></Field>
            <Field label="מספר אישי"><Input dir="ltr" value={f.personal_number} onChange={e=>set('personal_number',e.target.value)}/></Field>
            <Field label="יחידה"><Input value={f.unit} onChange={e=>set('unit',e.target.value)}/></Field>
            <Field label="טלפון"><Input dir="ltr" type="tel" value={f.phone} onChange={e=>set('phone',e.target.value)}/></Field>
            <Field label="תאריך יציאה" required><Input type="date" value={f.checkout_date} onChange={e=>set('checkout_date',e.target.value)}/></Field>
            <Field label="שעת יציאה"><Input type="time" value={f.checkout_time} onChange={e=>set('checkout_time',e.target.value)}/></Field>
            <Field label="תאריך החזרה" required><Input type="date" value={f.expected_return_date} onChange={e=>set('expected_return_date',e.target.value)}/></Field>
            <Field label="שעת החזרה"><Input type="time" value={f.expected_return_time} onChange={e=>set('expected_return_time',e.target.value)}/></Field>
          </div>
          <div className="mt-4"><Field label="מטרת ההשאלה"><Area value={f.purpose} onChange={e=>set('purpose',e.target.value)} placeholder="לדוגמה: צילום תרגיל יחידתי"/></Field></div>
        </div>
        <div className="card p-5">
          <h3 className="mb-1 font-bold text-white">הצהרה וחתימה</h3>
          <p className="mb-3 rounded-2xl border border-amber-400/20 bg-amber-400/10 p-3 text-xs leading-relaxed text-amber-100">
            אני מאשר/ת קבלת הציוד במצב תקין, מתחייב/ת לשמור עליו ולהחזירו במועד ובמצב שבו נמסר,
            ונושא/ת באחריות מלאה עד להחזרתו ואישורה.
          </p>
          <label className="mb-3 flex items-center gap-2 text-sm text-slate-200">
            <input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)} className="h-4 w-4 accent-brass"/>
            קראתי ואני מאשר/ת את ההצהרה
          </label>
          <SignaturePad onChange={setSig}/>
        </div>
      </div>
      <div className="space-y-4">
        <div className="card p-5">
          <h3 className="mb-3 font-bold text-white">בחירת ציוד</h3>
          <div className="relative mb-2">
            <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-500"><IconSearch size={16}/></span>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="חיפוש ציוד זמין…" className="input pr-9"/>
          </div>
          {avail===null ? <Spinner/> :
            <div className="max-h-44 space-y-1 overflow-y-auto">
              {results.length===0 ? <p className="py-3 text-center text-xs text-slate-500">אין תוצאות זמינות</p> :
                results.map(a=>(
                  <button key={a.id} onClick={()=>add(a)} className="flex w-full items-center justify-between rounded-xl px-3 py-2 text-right text-sm transition hover:bg-white/5">
                    <div><div className="font-medium text-slate-100">{a.name}</div>
                      <div className="text-xs text-slate-500">{a.serial_number||a.asset_number||''} · {a.category?.name||''}</div></div>
                    <IconPlus size={16} className="text-brass"/>
                  </button>
                ))}
            </div>}
          <div className="mt-3 border-t border-white/10 pt-3">
            <div className="mb-2 text-xs font-semibold text-slate-400">נבחרו ({picked.length})</div>
            {picked.length===0 ? <p className="text-xs text-slate-500">טרם נבחר ציוד</p> :
              <ul className="space-y-2">
                {picked.map(p=>(
                  <li key={p.id} className="flex items-center gap-2 rounded-xl bg-white/5 px-2.5 py-2 text-sm text-slate-100">
                    <span className="flex-1 truncate">{p.name}</span>
                    <input type="number" min="1" value={p.quantity}
                      onChange={e=>setPicked(x=>x.map(i=>i.id===p.id?{...i,quantity:Math.max(1,+e.target.value||1)}:i))}
                      className="w-14 rounded-lg border border-white/15 bg-white/5 px-2 py-1 text-center text-sm text-white"/>
                    <button onClick={()=>remove(p.id)} className="text-slate-400 transition hover:text-rose-400"><IconX size={16}/></button>
                  </li>
                ))}
              </ul>}
          </div>
        </div>
        <Btn variant="brass" className="w-full py-3" onClick={submit} disabled={busy}>{busy?'רושם…':'אישור השאלה וחתימה'}</Btn>
      </div>
    </div>
  );
}

function ReturnModal({borrow,onClose,onDone}){
  const toast = useToast();
  const [condition,setCondition] = useState('good');
  const [damage,setDamage] = useState(''); const [missing,setMissing] = useState('');
  const [notes,setNotes] = useState(''); const [approve,setApprove] = useState(true);
  const [photos,setPhotos] = useState([]); const [busy,setBusy] = useState(false);
  const upload = async e => {
    const files = [...(e.target.files||[])]; if(!files.length) return;
    setBusy(true); const paths=[];
    for(const file of files){
      const path = `ret-${Date.now()}-${Math.random().toString(36).slice(2)}.${file.name.split('.').pop()}`;
      const {error} = await sb.storage.from('return-photos').upload(path,file);
      if(!error) paths.push(path);
    }
    setPhotos(p=>[...p,...paths]); setBusy(false);
    if(paths.length) toast(`${paths.length} תמונות הועלו`,'success');
  };
  const submit = async () => {
    setBusy(true);
    const {error} = await sb.rpc('process_return',{
      p_borrow_id:borrow.id, p_condition:condition, p_damage_report:damage||null,
      p_missing_accessories:missing||null, p_notes:notes||null, p_photos:photos, p_approve:approve,
    });
    setBusy(false);
    if(error) return toast('שגיאה: '+error.message,'error');
    toast('ההחזרה אושרה · הציוד עודכן','success'); onDone();
  };
  return (
    <div className="space-y-4">
      <div className="rounded-2xl bg-white/5 p-3 text-sm">
        <div className="font-semibold text-white">{borrow.full_name}</div>
        <div className="text-xs text-slate-400">{borrow.borrow_items?.map(i=>i.equipment?.name).filter(Boolean).join(' · ')}</div>
      </div>
      <Field label="מצב הציוד">
        <div className="grid grid-cols-3 gap-2">
          {Object.entries(COND_HE).map(([k,v])=>(
            <button key={k} onClick={()=>setCondition(k)} className={cx('rounded-xl border px-3 py-2.5 text-sm font-medium transition',
              condition===k?(k==='good'?'border-emerald-400/50 bg-emerald-400/15 text-emerald-200':k==='minor_damage'?'border-amber-400/50 bg-amber-400/15 text-amber-200':'border-rose-400/50 bg-rose-400/15 text-rose-200'):'border-white/10 text-slate-400 hover:bg-white/5')}>{v}</button>
          ))}
        </div>
      </Field>
      {condition!=='good' && <Field label="דיווח נזק"><Area value={damage} onChange={e=>setDamage(e.target.value)} placeholder="תיאור הנזק…"/></Field>}
      <Field label="אביזרים חסרים"><Input value={missing} onChange={e=>setMissing(e.target.value)} placeholder="לדוגמה: סוללה, כבל HDMI"/></Field>
      <Field label="הערות"><Area value={notes} onChange={e=>setNotes(e.target.value)}/></Field>
      <Field label="תמונות (אופציונלי)"><input type="file" accept="image/*" multiple onChange={upload} className="w-full text-sm text-slate-300 file:mr-3 file:rounded-lg file:border-0 file:bg-white/10 file:px-3 file:py-2 file:text-slate-200"/></Field>
      {photos.length>0 && <div className="text-xs text-emerald-300">{photos.length} תמונות מצורפות</div>}
      {condition==='major_damage' && <p className="rounded-xl border border-rose-400/20 bg-rose-400/10 p-2.5 text-xs text-rose-200">שים לב: פריט עם נזק חמור יסומן אוטומטית כ״תקול״ ולא יחזור למלאי הזמין.</p>}
      <label className="flex items-center gap-2 text-sm text-slate-200">
        <input type="checkbox" checked={approve} onChange={e=>setApprove(e.target.checked)} className="h-4 w-4 accent-brass"/> אישור אחראי
      </label>
      <div className="flex justify-end gap-2 pt-1">
        <Btn variant="ghost" onClick={onClose}>ביטול</Btn>
        <Btn variant="brass" onClick={submit} disabled={busy}>{busy?'מעבד…':'אישור החזרה'}</Btn>
      </div>
    </div>
  );
}
function Returns(){
  const [rows,setRows] = useState(null); const [active,setActive] = useState(null);
  const load = useCallback(async ()=>{
    setRows(null);
    const {data} = await sb.from('borrows')
      .select('*, borrow_items(quantity, equipment:equipment_id(name,serial_number))')
      .in('status',['active','overdue']).order('expected_return_date');
    setRows(data||[]);
  },[]);
  useEffect(()=>{load();},[load]);
  if(rows===null) return <ListSkeleton/>;
  return (
    <div className="space-y-4">
      {rows.length===0 ? <Empty icon={<IconIn size={48}/>} title="אין השאלות פעילות" sub="כל הציוד חזר. עבודה יפה."/> :
        <div className="stagger space-y-3">
          {rows.map(b=>{
            const late = b.expected_return_date < todayISO();
            return (
              <div key={b.id} className="card lift flex flex-col gap-3 p-4 sm:flex-row sm:items-center sm:justify-between">
                <div className="min-w-0">
                  <div className="flex items-center gap-2">
                    <span className="font-semibold text-white">{b.full_name}</span>
                    <Badge map={BORROW_STATUS} value={late?'overdue':b.status}/>
                  </div>
                  <div className="mt-0.5 truncate text-sm text-slate-400">
                    {b.borrow_items?.map(i=>i.equipment?.name).filter(Boolean).join(' · ')||'—'}
                  </div>
                  <div className={cx('num mt-0.5 text-xs',late?'font-medium text-rose-300':'text-slate-500')}>
                    להחזרה: {fmtDate(b.expected_return_date)} {b.expected_return_time?.slice(0,5)||''}
                  </div>
                </div>
                <Btn variant="brass" onClick={()=>setActive(b)}><IconIn size={16}/> קליטת החזרה</Btn>
              </div>
            );
          })}
        </div>}
      <Modal open={!!active} onClose={()=>setActive(null)} title="קליטת החזרת ציוד">
        {active && <ReturnModal borrow={active} onClose={()=>setActive(null)} onDone={()=>{setActive(null);load();}}/>}
      </Modal>
    </div>
  );
}

  );
  const UserCard = () => (
    <div className="rounded-2xl border border-white/10 bg-white/5 p-3">
      <div className="truncate text-sm font-semibold text-white">{profile?.full_name||'משתמש'}</div>
      <div className="text-xs text-brass">{ROLE_HE[role]}</div>
      <button onClick={signOut} className="mt-2 flex w-full items-center justify-center gap-2 rounded-xl bg-white/8 py-2 text-xs text-slate-300 transition hover:bg-white/14 hover:text-white">
        <IconLogout size={15}/> התנתקות
      </button>
    </div>
  );
  return (
    <div id="app-root" className="relative flex min-h-full">
      {/* desktop rail */}
      <aside className="sticky top-0 hidden h-screen w-[268px] shrink-0 p-3 lg:block">
        <div className="card flex h-full flex-col rounded-[26px] p-4">
          <div className="mb-6 flex items-center gap-3 px-1">
            <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-b from-[#f3cb63] to-[#c99a2e] text-ink shadow-[0_10px_26px_-10px_rgba(231,184,75,.7)]"><IconBox size={22}/></div>
            <div><div className="font-bold leading-tight text-white">נכסי מולטימדיה</div>
              <div className="text-[11px] text-slate-400">מחלקת המולטימדיה</div></div>
          </div>
          <NavLinks/>
          <div className="mt-auto"><UserCard/></div>
        </div>
      </aside>

      {/* mobile drawer */}
      {navOpen && (
        <div className="fixed inset-0 z-40 lg:hidden" onClick={()=>setNavOpen(false)}>
          <div className="absolute inset-0 bg-black/55 backdrop-blur-md"></div>
          <aside className="pop absolute right-0 top-0 h-full w-[272px] p-3" onClick={e=>e.stopPropagation()}>
            <div className="glass-modal flex h-full flex-col rounded-[24px] p-4">
              <div className="mb-6 flex items-center justify-between">
                <div className="font-bold text-white">נכסי מולטימדיה</div>
                <button onClick={()=>setNavOpen(false)} className="rounded-xl p-1.5 text-slate-400 hover:bg-white/10 hover:text-white"><IconX/></button>
              </div>
              <NavLinks/>
              <div className="mt-auto"><UserCard/></div>
            </div>
          </aside>
        </div>
      )}

      {/* main */}
      <div className="flex min-w-0 flex-1 flex-col">
        <header className="sticky top-0 z-30 p-3">
          <div className="card flex items-center justify-between rounded-[22px] px-4 py-3">
            <div className="flex items-center gap-3">
              <button onClick={()=>setNavOpen(true)} className="rounded-xl p-1.5 text-slate-300 transition hover:bg-white/10 lg:hidden"><IconMenu/></button>
              <h1 className="text-lg font-bold tracking-tight text-white lg:text-xl">{titles[view]}</h1>
              {DEMO && <span className="chip whitespace-nowrap border-amber-400/30 bg-amber-400/12 text-amber-200"><span className="hidden sm:inline">מצב הדגמה · הנתונים לא נשמרים</span><span className="sm:hidden">הדגמה</span></span>}
            </div>
            {isStaff && view!=='borrow' &&
              <Btn variant="brass" onClick={()=>go('borrow')} className="hidden sm:inline-flex"><IconOut size={16}/> השאלה חדשה</Btn>}
          </div>
        </header>
        <main className="flex-1 px-3 pb-8 lg:px-4">
          <div key={view} className="rise mx-auto max-w-7xl">
            {view==='dashboard' && <Dashboard go={go}/>}
            {view==='equipment' && <Equipment initialFilter={eqFilter}/>}
            {view==='borrow'    && <Borrow onDone={()=>go('dashboard')}/>}
            {view==='returns'   && <Returns/>}
            {view==='audit'     && <AuditLog/>}
            {view==='users'     && <Users/>}
          </div>
        </main>
      </div>
    </div>
  );
}

/* =====================================================================
   ROOT
   ===================================================================== */
function ConfigMissing(){
  return (
    <div className="flex min-h-full items-center justify-center p-6">
      <div className="card rise max-w-md p-6 text-center">
        <div className="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-amber-400/15 text-amber-200 ring-1 ring-amber-400/30"><IconBox/></div>
        <h1 className="text-lg font-bold text-white">חיבור ל-Supabase נדרש</h1>
        <p className="mt-2 text-sm leading-relaxed text-slate-400">
          יש להזין את כתובת הפרויקט ומפתח ה-anon בקובץ, בשורות
          <code className="mx-1 rounded bg-white/10 px-1.5 py-0.5 text-xs" dir="ltr">SUPABASE_URL</code>
          ו-<code className="rounded bg-white/10 px-1.5 py-0.5 text-xs" dir="ltr">SUPABASE_ANON_KEY</code>.
          את הערכים מוצאים בלוח הבקרה של Supabase תחת Settings → API.
        </p>
      </div>
    </div>
  );
}
const LoadingScreen = () => <div className="flex min-h-full items-center justify-center"><Spinner label="טוען…"/></div>;
function App(){
  useAmbientParallax();
  useEffect(()=>{ const r=document.getElementById('root'); if(r) r.setAttribute('data-mounted','1'); },[]);
  const {session} = useAuth();
  let content;
  if(!sb) content = <ConfigMissing/>;
  else if(session===undefined) content = <LoadingScreen/>;
  else content = session ? <Shell/> : <Login/>;
  return <><Ambient/>{content}</>;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastHost><AuthProvider><App/></AuthProvider></ToastHost>
);
</script>
</body>
</html>
