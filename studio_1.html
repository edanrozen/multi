<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1011">
<title>מחסן הסטודיו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Secular+One&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — "ארגז ציוד"
   Surfaces read like anodised camera bodies and flight-case
   interiors. Status colours come off a set: tungsten for gear
   in use, daylight green for gear at rest, flare red for fault.
   Section rules are clapperboard stripes — the one emblem a
   video unit owns outright.
   ============================================================ */
:root{
  --void:#0D1011;
  --case:#171B1D;
  --case-2:#1E2427;
  --rib:#2C3337;
  --dim:#8A9295;
  --dim-2:#5E686B;
  --lit:#EDEFEB;

  --tungsten:#F0A02E;   /* בחוץ */
  --tungsten-dim:#3A2C11;
  --daylight:#43C08A;   /* זמין */
  --daylight-dim:#122E23;
  --flare:#E85A4F;      /* תקלה / חסר */
  --flare-dim:#3A1B18;
  --data:#6FA8C9;       /* מתכלים */
  --data-dim:#14262F;

  --r-s:6px; --r-m:12px; --r-l:18px;
  --tab-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'Secular One','Heebo',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --clapper:repeating-linear-gradient(115deg,var(--rib) 0 7px,transparent 7px 15px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);background:var(--void);color:var(--lit);
  font-size:16px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--tungsten);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------- SETUP ---------- */
#setup{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:28px 22px calc(28px + var(--safe-b));
}
#setup .mark{width:186px;max-width:60%;margin:0 0 22px;opacity:.95}
#setup h1{font-family:var(--display);font-size:31px;line-height:1.15;margin:0 0 6px}
#setup .sub{color:var(--dim);margin:0 0 26px;font-size:15px}
#setup ol{padding-inline-start:20px;margin:0 0 20px;color:var(--dim);font-size:14.5px;line-height:1.8}
#setup ol a{color:var(--tungsten)}
#setup code{font-family:var(--mono);font-size:12.5px;background:var(--case-2);color:var(--lit);padding:1px 6px;border-radius:4px}
#cfgInput{
  width:100%;min-height:150px;background:var(--case);border:1.5px solid var(--rib);color:var(--lit);
  border-radius:var(--r-m);padding:13px;font-family:var(--mono);font-size:12.5px;
  direction:ltr;text-align:left;resize:vertical;
}
#setup .err{color:var(--flare);font-size:14px;margin-top:10px;min-height:20px}
.btn-primary{
  width:100%;margin-top:14px;background:var(--tungsten);color:#181203;font-weight:800;font-size:17px;
  padding:16px;border-radius:var(--r-m);
}
.btn-primary:active{transform:scale(.985)}

/* ---------- SHELL ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
header.top{
  position:sticky;top:0;z-index:40;background:var(--void);
  padding:calc(env(safe-area-inset-top,0px) + 11px) 16px 11px;
  display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--rib);
}
header.top .mark{height:30px;width:auto;flex:none;opacity:.96}
.wordmark{font-family:var(--display);font-size:16.5px;letter-spacing:.2px;line-height:1;color:var(--lit);white-space:nowrap}
@media (max-width:399px){.wordmark{display:none}}
.opchip{
  margin-inline-start:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;
  color:var(--lit);background:var(--case-2);border:1px solid var(--rib);
  padding:6px 12px;border-radius:20px;font-weight:600;white-space:nowrap;
  max-width:46%;min-width:0;
}
.opchip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;padding:18px 16px calc(var(--tab-h) + var(--safe-b) + 22px);max-width:760px;width:100%;margin:0 auto}
body.has-fab main{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 98px)}

.opchip .dot{width:6px;height:6px;border-radius:50%;background:var(--daylight);flex:none}
.opchip.off .dot{background:var(--tungsten)}

/* ---------- TABS ---------- */
nav.tabs{
  position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--case);
  display:flex;padding-bottom:var(--safe-b);border-top:1px solid var(--rib);
}
nav.tabs button{
  flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--dim-2);font-size:11.5px;font-weight:700;position:relative;
}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--lit)}
nav.tabs button.on::before{content:"";position:absolute;top:0;inset-inline:24%;height:2.5px;background:var(--tungsten)}
nav.tabs .badge{
  position:absolute;top:10px;inset-inline-end:calc(50% - 25px);background:var(--tungsten);color:#181203;
  font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;
}

/* ---------- TYPE / SECTIONS ---------- */
.page-title{font-family:var(--display);font-size:25px;margin:0 0 3px;line-height:1.2}
.page-sub{color:var(--dim);font-size:14px;margin:0 0 20px}
.sec-label{
  font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--dim);
  margin:26px 0 11px;display:flex;align-items:center;gap:10px;width:100%;text-align:start;
}
.sec-label::after{content:"";flex:1;height:6px;background:var(--clapper);border-radius:1px}
.sec-label:first-child{margin-top:0}

/* ---------- READOUT ---------- */
.readout{
  display:flex;background:var(--case);border:1px solid var(--rib);border-radius:var(--r-m);
  overflow:hidden;margin-bottom:6px;
}
.readout div{flex:1;padding:14px 8px;text-align:center;border-inline-start:1px solid var(--rib)}
.readout div:first-child{border-inline-start:none}
.readout b{font-family:var(--display);font-size:28px;line-height:1;display:block}
.readout span{font-size:11.5px;color:var(--dim);font-weight:700;display:block;margin-top:6px}
.readout .out b{color:var(--tungsten)}
.readout .ok b{color:var(--daylight)}
.readout .bad b{color:var(--flare)}

/* ---------- TAG (signature) ----------
   Gear that's out renders as a hanging equipment tag: punched
   hole and tungsten spine, the way a cage actually tags kit. */
.tag{
  background:var(--case);border:1px solid var(--rib);border-radius:var(--r-m);
  padding:14px 15px;margin-bottom:8px;position:relative;overflow:hidden;
  border-inline-start:3px solid var(--tungsten);display:block;width:100%;text-align:start;
}
.tag::after{
  content:"";position:absolute;top:14px;inset-inline-end:14px;width:9px;height:9px;
  border-radius:50%;border:2px solid var(--rib);
}
.tag.late{border-inline-start-color:var(--flare);background:linear-gradient(90deg,var(--flare-dim),var(--case) 46%)}
.tag .t-name{font-weight:700;font-size:16px;padding-inline-end:26px;line-height:1.35}
.tag .t-who{color:var(--dim);font-size:13.5px;margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag .t-who b{color:var(--lit);font-weight:700}
.pill{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.pill.days{background:var(--case-2);color:var(--dim)}
.pill.late{background:var(--flare);color:#fff}
.pill.qty{background:var(--data-dim);color:var(--data);font-family:var(--mono)}

/* ---------- ROW ---------- */
.row{
  background:var(--case);border:1px solid var(--rib);border-radius:var(--r-m);padding:13px 14px;
  margin-bottom:7px;display:flex;align-items:center;gap:12px;width:100%;text-align:start;
}
.row .status-dot{width:9px;height:9px;border-radius:50%;flex:none}
.sd-available{background:var(--daylight)} .sd-out{background:var(--tungsten)}
.sd-repair{background:var(--flare)} .sd-lost{background:var(--dim-2)}
.row .r-main{flex:1;min-width:0}
.row .r-name{font-weight:600;font-size:15.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-meta{font-size:12.5px;color:var(--dim);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.row .r-meta .serial{font-family:var(--mono);font-size:11.5px;color:var(--dim-2)}
.row .chev{color:var(--dim-2);flex:none}
.row.picked{border-color:var(--tungsten);background:var(--case-2)}
.check{
  width:25px;height:25px;border-radius:7px;border:2px solid var(--rib);flex:none;
  display:grid;place-items:center;transition:background .12s,border-color .12s;
}
.check.on{background:var(--tungsten);border-color:var(--tungsten)}
.check svg{width:14px;height:14px;stroke:#181203;stroke-width:3.2;fill:none;opacity:0}
.check.on svg{opacity:1}

/* ---------- CONTROLS ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--dim);margin-bottom:7px}
.input{
  width:100%;background:var(--case);border:1.5px solid var(--rib);border-radius:var(--r-m);
  padding:13px 14px;font-size:16px;color:var(--lit);
}
.input::placeholder{color:var(--dim-2)}
.input:focus{outline:none;border-color:var(--tungsten)}
textarea.input{min-height:74px;resize:vertical}
.search{position:relative;margin-bottom:12px}
.search .input{padding-inline-start:42px}
.search svg{position:absolute;inset-inline-start:14px;top:15px;width:18px;height:18px;stroke:var(--dim-2);fill:none;stroke-width:2}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:13px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;background:var(--case);border:1.5px solid var(--rib);border-radius:20px;
  padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--dim);white-space:nowrap;
}
.chip.on{background:var(--lit);border-color:var(--lit);color:var(--void)}
.btn{
  width:100%;padding:15px;border-radius:var(--r-m);font-weight:800;font-size:16.5px;
  background:var(--lit);color:var(--void);display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.32}
.btn.amber{background:var(--tungsten);color:#181203}
.btn.green{background:var(--daylight);color:#062018}
.btn.ghost{background:transparent;color:var(--lit);box-shadow:inset 0 0 0 1.5px var(--rib)}
.btn.danger{background:var(--flare-dim);color:var(--flare)}
.btn-sm{padding:11px;font-size:14.5px;border-radius:var(--r-s)}
.btn-row{display:flex;gap:9px;margin-top:9px}
.fab-bar{
  position:fixed;inset-inline:0;bottom:calc(var(--tab-h) + var(--safe-b));z-index:45;
  padding:14px 16px;background:linear-gradient(transparent,var(--void) 30%);
}
.fab-bar .inner{max-width:760px;margin:0 auto}

/* ---------- EMPTY ---------- */
.empty{text-align:center;padding:42px 20px;color:var(--dim)}
.empty .big{font-family:var(--display);font-size:19px;color:var(--lit);margin-bottom:7px}
.empty p{font-size:14.5px;margin:0 0 18px;line-height:1.65}

/* ---------- SHEET ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:70;background:var(--void);
  border-top:1px solid var(--rib);border-radius:var(--r-l) var(--r-l) 0 0;max-height:92dvh;overflow-y:auto;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  padding:8px 18px calc(24px + var(--safe-b));
}
#sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;background:var(--rib);border-radius:3px;margin:6px auto 16px}
.sheet-title{font-family:var(--display);font-size:21px;margin:0 0 5px;line-height:1.25}
.sheet-sub{color:var(--dim);font-size:13.5px;margin:0 0 18px}

/* ---------- AUTOCOMPLETE ---------- */
.ac{position:relative}
.ac-list{
  position:absolute;inset-inline:0;top:calc(100% + 5px);background:var(--case-2);border:1px solid var(--rib);
  border-radius:var(--r-m);box-shadow:0 14px 34px rgba(0,0,0,.5);max-height:230px;overflow-y:auto;z-index:8;
}
.ac-list button{width:100%;text-align:start;padding:13px 15px;font-size:15.5px;border-bottom:1px solid var(--rib)}
.ac-list button:last-child{border-bottom:none}
.ac-list button.new{color:var(--daylight);font-weight:700}
.ac-list button .cnt{float:inline-end;font-size:12.5px;color:var(--dim-2);font-family:var(--mono)}

/* ---------- SIGNATURE ----------
   The pad stays paper-white on the dark shell: signing should
   look like signing, not like using an app. */
.sigwrap{
  background:#FBFBF8;border-radius:var(--r-m);position:relative;overflow:hidden;margin-bottom:11px;
  border:1px solid var(--rib);
}
.sigwrap canvas{display:block;width:100%;height:190px;touch-action:none;background:transparent}
.sigwrap .baseline{position:absolute;inset-inline:22px;bottom:44px;height:1px;background:rgba(13,16,17,.18);pointer-events:none}
.sigwrap .hintline{position:absolute;inset-inline-start:22px;bottom:22px;font-size:12.5px;color:#9AA1A3;pointer-events:none;font-weight:600}
.sigwrap.signed .hintline,.sigwrap.signed .baseline{opacity:0}
.receipt{background:var(--case);border:1px solid var(--rib);border-radius:var(--r-m);padding:14px 15px;margin-bottom:10px}
.receipt .r-head{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.receipt .r-head b{font-size:15.5px;font-weight:700}
.receipt .r-head .when{margin-inline-start:auto;font-family:var(--mono);font-size:12px;color:var(--dim-2)}
.receipt ul{margin:0;padding-inline-start:18px;font-size:14px;line-height:1.75;color:var(--dim)}
.receipt img{
  width:100%;max-height:110px;object-fit:contain;object-position:right;background:#FBFBF8;
  margin-top:11px;border-radius:var(--r-s);padding:6px;
}

/* ---------- LOG ---------- */
.log-day{font-size:11.5px;font-weight:800;color:var(--dim-2);letter-spacing:.09em;margin:22px 0 8px}
.log{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--rib)}
.log .ic{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:800}
.ic.checkout{background:var(--tungsten-dim);color:var(--tungsten)}
.ic.return{background:var(--daylight-dim);color:var(--daylight)}
.ic.repair{background:var(--flare-dim);color:var(--flare)}
.ic.adjust{background:var(--data-dim);color:var(--data)}
.log .l-main{flex:1;min-width:0}
.log .l-t{font-size:14.5px;line-height:1.45;color:var(--lit)}
.log .l-t b{font-weight:700}
.log .l-time{font-size:12px;color:var(--dim-2);font-family:var(--mono);margin-top:3px}
.log .l-note{font-size:13px;color:var(--dim);margin-top:4px;font-style:italic}

/* ---------- TOAST ---------- */
#toast{
  position:fixed;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);inset-inline:16px;z-index:90;
  background:var(--lit);color:var(--void);padding:14px 17px;border-radius:var(--r-m);font-size:15px;font-weight:700;
  box-shadow:0 10px 34px rgba(0,0,0,.55);opacity:0;transform:translateY(14px);pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:730px;margin:0 auto;
}
#toast.on{opacity:1;transform:translateY(0)}
#toast.bad{background:var(--flare);color:#fff}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (min-width:620px){main{padding-inline:22px}}
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<div id="setup" class="hide">
  <img class="mark" data-logo alt="">
  <h1>מחסן הסטודיו</h1>
  <p class="sub">חיבור ראשוני — פעם אחת לכל מכשיר.</p>
  <ol>
    <li>היכנס ל־<a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> וצור פרויקט.</li>
    <li>הפעל <code>Firestore Database</code> במצב Production.</li>
    <li>הפעל <code>Authentication → Anonymous</code>.</li>
    <li>ב־<code>Project settings</code> צור אפליקציית Web והעתק את אובייקט <code>firebaseConfig</code>.</li>
    <li>הדבק אותו כאן:</li>
  </ol>
  <textarea id="cfgInput" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder='{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }'></textarea>
  <div class="err" id="cfgErr"></div>
  <button class="btn-primary" id="cfgGo">התחבר</button>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <header class="top">
    <img class="mark" data-logo alt="">
    <div class="wordmark">מחסן הסטודיו</div>
    <button class="opchip" id="opChip"><span class="dot"></span><span id="opTxt">—</span></button>
  </header>
  <main id="view"></main>
  <div id="fabBar"></div>
  <nav class="tabs" id="tabs"></nav>
</div>

<div id="scrim"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, onSnapshot, addDoc, updateDoc, deleteDoc,
  query, orderBy, limit, runTransaction, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   ARCHITECTURE
   ------------------------------------------------------------
   Source of truth is the append-only ledger (`txns`). Every
   movement of gear is an immutable record that snapshots the
   item name and person name at the time it happened, so history
   stays readable even after items or people are removed.

   `items` carries a denormalised current-state cache (status,
   holder, qtyAvailable) purely so the board renders in O(1)
   without replaying the ledger. That cache is only ever written
   inside the same atomic transaction that appends the ledger
   entry — the two can never drift apart.

   Every checkout/return runs through runTransaction: all reads
   first, then all writes. Two people tapping the same item at

const CFG_KEY = 'studio.fb.cfg';
const OP_KEY  = 'studio.operator';
const $  = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- STATE ---------- */
const S = {
  db:null, uid:null, ready:false, online:true,
  operator: localStorage.getItem(OP_KEY) || '',
  items:[], people:[], kits:[], txns:[], receipts:[],
  tab:'board',
  pick:new Set(), qty:{}, person:null, note:'',
  q:'', cat:'הכל', statusFilter:'הכל',
  logFilter:null,
};

/* ---------- HELPERS ---------- */
const norm = s => String(s||'').trim().replace(/\s+/g,' ');
const key  = s => norm(s).toLowerCase();
const ts   = v => v?.toDate ? v.toDate() : (v instanceof Date ? v : (v ? new Date(v) : null));
const daysSince = d => d ? Math.floor((Date.now() - d.getTime()) / 864e5) : 0;
const fmtTime = d => d ? d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) : '';
const fmtDay  = d => {
  if (!d) return '';
  const t = new Date(); t.setHours(0,0,0,0);
  const x = new Date(d); x.setHours(0,0,0,0);
  const diff = Math.round((t - x)/864e5);
  if (diff === 0) return 'היום';
  if (diff === 1) return 'אתמול';
  return d.toLocaleDateString('he-IL',{day:'numeric',month:'long'});
};

function toast(msg, bad){
  const t = $('#toast'); t.textContent = msg;
  t.className = bad ? 'on bad' : 'on';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = '', 2800);
}

/* ---------- SHEET ---------- */
function openSheet(build){
  const sh = $('#sheet');
  sh.innerHTML = '';
  sh.appendChild(el('div','grab'));
  build(sh);
  $('#scrim').classList.add('on');
  requestAnimationFrame(() => sh.classList.add('on'));
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  $('#scrim').classList.remove('on');
}
$('#scrim').addEventListener('click', closeSheet);

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch(e){}

  const hash = location.hash.slice(1);
  if (!cfg && hash.startsWith('cfg=')) {
    try {
      cfg = JSON.parse(decodeURIComponent(atob(hash.slice(4))));
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      history.replaceState(null,'',location.pathname);
    } catch(e){}
  }
  if (cfg) connect(cfg); else showSetup();
}

function showSetup(){
  $('#setup').classList.remove('hide');
  $('#cfgGo').addEventListener('click', () => {
    const raw = $('#cfgInput').value.trim();
    const errBox = $('#cfgErr');
    let cfg;
    try {
      // Accepts a bare object, `const firebaseConfig = {...};`, or JSON.
      const m = raw.match(/\{[\s\S]*\}/);
      if (!m) throw 0;
      cfg = (new Function('return (' + m[0] + ')'))();
    } catch(e){ errBox.textContent = 'לא הצלחתי לקרוא את ההגדרות. הדבק את האובייקט המלא, מ־{ ועד }.'; return; }
    if (!cfg || !cfg.apiKey || !cfg.projectId) { errBox.textContent = 'חסרים apiKey או projectId.'; return; }
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    location.reload();
  });
}

async function connect(cfg){
  try {
    const app = initializeApp(cfg);
    S.db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });
    const auth = getAuth(app);
    onAuthStateChanged(auth, u => {
      if (!u) return;
      S.uid = u.uid;
      $('#app').classList.remove('hide');
      subscribe();
      renderOpChip();
      render();
      if (!S.operator) setTimeout(() => operatorSheet(), 500);
    });
    await signInAnonymously(auth);
  } catch(e){
    localStorage.removeItem(CFG_KEY);
    $('#setup').classList.remove('hide');
    $('#cfgErr').textContent = 'החיבור נכשל: ' + e.message;
    showSetup();
  }
  window.addEventListener('online',  () => setNet(true));
  window.addEventListener('offline', () => setNet(false));
  setNet(navigator.onLine);
}

function setNet(on){
  S.online = on;

}

/* ---------- LIVE DATA ---------- */
function subscribe(){
  const map = s => s.docs.map(d => ({ id:d.id, ...d.data() }));
  onSnapshot(collection(S.db,'items'),  s => { S.items  = map(s); render(); });
  onSnapshot(collection(S.db,'people'), s => { S.people = map(s); render(); });
  onSnapshot(collection(S.db,'kits'),   s => { S.kits   = map(s); render(); });
  onSnapshot(query(collection(S.db,'receipts'), orderBy('at','desc'), limit(120)),
             s => { S.receipts = map(s); render(); });
  onSnapshot(query(collection(S.db,'txns'), orderBy('at','desc'), limit(300)),
             s => { S.txns = map(s); S.ready = true; render(); });
}

/* ============================================================
   WRITES — every one is atomic and ledger-backed
   ============================================================ */

async function ensurePerson(name){
  const n = norm(name);
  const k = key(n);
  const hit = S.people.find(p => key(p.name) === k);
  if (hit) return hit;
  const ref = await addDoc(collection(S.db,'people'), { name:n, nameKey:k, createdAt:serverTimestamp() });
  return { id:ref.id, name:n };
}

/* A checkout produces one signed receipt covering every item in it.
   The receipt and all its ledger lines are written in a single
   transaction — a signature can never exist without the movement it
   authorises, and no item can move without being on a signed receipt. */
async function checkout(person, ids, qtyMap, note, signature){
  const itemRefs = ids.map(id => doc(S.db,'items',id));
  const receiptRef = doc(collection(S.db,'receipts'));
  const stamped = [];

  await runTransaction(S.db, async tx => {
    // --- ALL READS FIRST (Firestore requirement) ---
    const snaps = [];
    for (const r of itemRefs) snaps.push(await tx.get(r));

    const blocked = [];
    for (const s of snaps) {
      if (!s.exists()) { blocked.push('פריט שנמחק'); continue; }
      const it = s.data();
      if (it.kind === 'consumable') {
        const want = qtyMap[s.id] || 1;
        if ((it.qtyAvailable ?? 0) < want) blocked.push(`${it.name} — נשארו ${it.qtyAvailable ?? 0}`);
      } else if (it.status !== 'available') {
        blocked.push(`${it.name} — ${it.status === 'out' ? 'כבר אצל ' + (it.holderName || 'מישהו') : 'לא זמין'}`);
      }
    }
    if (blocked.length) { const e = new Error(blocked.join(' · ')); e.blocked = true; throw e; }

    // --- THEN ALL WRITES ---
    const lines = [];
    for (const s of snaps) {
      const it = s.data();
      const ref = doc(S.db,'items',s.id);
      const q = it.kind === 'consumable' ? (qtyMap[s.id] || 1) : 1;

      if (it.kind === 'consumable') {
        tx.update(ref, { qtyAvailable: (it.qtyAvailable ?? 0) - q });
      } else {
        tx.update(ref, {
          status:'out', holderId:person.id, holderName:person.name,
          checkedOutAt: new Date(), receiptId: receiptRef.id
        });
      }
      tx.set(doc(collection(S.db,'txns')), {
        action:'checkout', itemId:s.id, itemName:it.name,
        personId:person.id, personName:person.name,
        qty:q, note: note || '', operator: S.operator || '',
        receiptId: receiptRef.id, at: serverTimestamp(), by: S.uid
      });
      lines.push({ id:s.id, name:it.name, qty:q });
      stamped.push(it.name);
    }

    tx.set(receiptRef, {
      type:'checkout',
      personId:person.id, personName:person.name,
      operator: S.operator || '',
      lines, note: note || '',
      signature: signature || '',
      at: serverTimestamp(), by: S.uid
    });
  });
  return stamped;
}

async function returnItems(ids, qtyMap, note){
  const itemRefs = ids.map(id => doc(S.db,'items',id));
  await runTransaction(S.db, async tx => {
    const snaps = [];
    for (const r of itemRefs) snaps.push(await tx.get(r));

    for (const s of snaps) {
      if (!s.exists()) continue;
      const it = s.data();
      const ref = doc(S.db,'items',s.id);
      const q = it.kind === 'consumable' ? (qtyMap[s.id] || 1) : 1;
      const who = it.holderName || '';
      const whoId = it.holderId || null;

      if (it.kind === 'consumable') {
        tx.update(ref, { qtyAvailable: Math.min((it.qtyTotal ?? 0), (it.qtyAvailable ?? 0) + q) });
      } else {
        tx.update(ref, { status:'available', holderId:null, holderName:null, checkedOutAt:null, receiptId:null });
      }
      tx.set(doc(collection(S.db,'txns')), {
        action:'return', itemId:s.id, itemName:it.name,
        personId:whoId, personName:who,
        qty:q, note: note || '', operator: S.operator || '',
        at: serverTimestamp(), by: S.uid
      });
    }
  });
}

async function markStatus(item, status, note){
  await runTransaction(S.db, async tx => {
    const ref = doc(S.db,'items',item.id);
    const s = await tx.get(ref);
    if (!s.exists()) throw new Error('הפריט לא קיים');
    const it = s.data();
    tx.update(ref, { status, holderId:null, holderName:null, checkedOutAt:null });
    tx.set(doc(collection(S.db,'txns')), {
      action: status === 'available' ? 'return' : 'repair',
      itemId:item.id, itemName:it.name,
      personId:it.holderId || null, personName:it.holderName || '',
      statusTo:status, qty:1, note: note || '', at: serverTimestamp(), by: S.uid
    });
  });
}

async function restock(item, delta, note){
  await runTransaction(S.db, async tx => {
    const ref = doc(S.db,'items',item.id);
    const s = await tx.get(ref);
    if (!s.exists()) throw new Error('הפריט לא קיים');
    const it = s.data();
    const total = Math.max(0, (it.qtyTotal ?? 0) + delta);
    const avail = Math.max(0, (it.qtyAvailable ?? 0) + delta);
    tx.update(ref, { qtyTotal: total, qtyAvailable: avail });
    tx.set(doc(collection(S.db,'txns')), {
      action:'adjust', itemId:item.id, itemName:it.name,
      personId:null, personName:'', qty:delta,
      note: note || '', at: serverTimestamp(), by: S.uid
    });
  });
}

/* ============================================================
   DERIVED VIEWS
   ============================================================ */
const outItems  = () => S.items.filter(i => i.kind !== 'consumable' && i.status === 'out');
const brokeItems= () => S.items.filter(i => i.status === 'repair' || i.status === 'lost');
const availCount= () => S.items.filter(i => i.kind === 'consumable' ? (i.qtyAvailable ?? 0) > 0 : i.status === 'available').length;
const lowStock  = () => S.items.filter(i => i.kind === 'consumable' && (i.qtyAvailable ?? 0) <= (i.qtyLow ?? 2));
const categories= () => ['הכל', ...[...new Set(S.items.map(i => i.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he'))];
const LATE_DAYS = 7;

function statusLabel(i){
  if (i.kind === 'consumable') return `${i.qtyAvailable ?? 0} / ${i.qtyTotal ?? 0}`;
  return { available:'זמין', out:'בחוץ', repair:'בתיקון', lost:'חסר' }[i.status] || 'זמין';
}

/* ---------- BOARD ---------- */
function viewBoard(v){
  v.appendChild(Object.assign(el('h1','page-title','לוח המחסן'), {}));
  v.appendChild(el('p','page-sub','מה בחוץ עכשיו, ואצל מי.'));

  const sum = el('div','readout');
  const mk = (cls, num, lbl) => {
    const d = el('div', cls);
    d.appendChild(el('b', null, String(num)));
    d.appendChild(el('span', null, lbl));
    return d;
  };
  const out = outItems();
  sum.append(mk('out', out.length, 'בחוץ'), mk('ok', availCount(), 'זמין'), mk('bad', brokeItems().length, 'תקלה / חסר'));
  v.appendChild(sum);

  if (!S.items.length) {
    v.appendChild(emptyState('אין עדיין ציוד במערכת',
      'התחל בהוספת הפריטים של הסטודיו. אפשר להוסיף בהדרגה — לא צריך הכול בבת אחת.',
      'הוסף פריט ראשון', () => itemSheet()));
    return;
  }

  const low = lowStock();
  if (low.length) {
    v.appendChild(el('div','sec-label','מלאי נמוך'));
    low.forEach(i => v.appendChild(itemRow(i, () => itemSheet(i))));
  }

  v.appendChild(el('div','sec-label','ציוד בחוץ'));
  if (!out.length) {
    const e = el('div','empty');
    e.appendChild(el('div','big','הכול במקום'));
    e.appendChild(el('p', null, 'אין כרגע ציוד בחוץ.'));
    v.appendChild(e);
  } else {
    const byPerson = {};
    out.forEach(i => { (byPerson[i.holderName || 'לא ידוע'] ||= []).push(i); });
    Object.entries(byPerson)
      .sort((a,b) => b[1].length - a[1].length)
      .forEach(([who, list]) => {
        const head = el('button','sec-label');
        head.style.cssText = 'width:100%;text-align:start';
        head.textContent = `${who} · ${list.length}`;
        head.onclick = () => personSheet(who);
        v.appendChild(head);
        list.sort((a,b) => (ts(a.checkedOutAt)?.getTime()||0) - (ts(b.checkedOutAt)?.getTime()||0));
        list.forEach(i => {
          const d = ts(i.checkedOutAt);
          const days = daysSince(d);
          const late = days >= LATE_DAYS;
          const t = el('button','tag' + (late ? ' late' : ''));
          t.innerHTML =
            `<div class="t-name">${esc(i.name)}</div>
             <div class="t-who">
               <span class="pill ${late ? 'late' : 'days'}">${days === 0 ? 'היום' : days + ' ימים'}</span>
               ${i.serial ? `<span class="mono" style="font-size:11.5px;color:var(--dim-2)">${esc(i.serial)}</span>` : ''}
             </div>`;
          t.onclick = () => itemSheet(i);
          v.appendChild(t);
        });
      });
  }

  const broke = brokeItems();
  if (broke.length) {
    v.appendChild(el('div','sec-label','תקלות וחוסרים'));
    broke.forEach(i => v.appendChild(itemRow(i, () => itemSheet(i))));
  }
}

function emptyState(title, body, cta, fn){
  const e = el('div','empty');
  e.appendChild(el('div','big',title));
  e.appendChild(el('p',null,body));
  if (cta) { const b = el('button','btn', cta); b.onclick = fn; e.appendChild(b); }
  return e;
}

/* ---------- ITEM ROW ---------- */
function itemRow(i, onClick, opts = {}){
  const r = el('button','row' + (opts.picked ? ' picked' : ''));
  const dot = el('span','status-dot sd-' + (i.kind === 'consumable' ? ((i.qtyAvailable??0) > 0 ? 'available' : 'lost') : (i.status || 'available')));
  const main = el('div','r-main');
  main.appendChild(el('div','r-name', i.name));
  const meta = el('div','r-meta');
  meta.appendChild(el('span', null, statusLabel(i)));
  if (i.category) meta.appendChild(el('span', null, '· ' + i.category));
  if (i.holderName && i.status === 'out') meta.appendChild(el('span', null, '· ' + i.holderName));
  if (i.serial) meta.appendChild(el('span','serial', i.serial));
  main.appendChild(meta);
  r.append(dot, main);

  if (opts.checkbox) {
    const c = el('div','check' + (opts.picked ? ' on' : ''));
    c.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>';
    r.appendChild(c);
  } else {
    const ch = el('span','chev'); ch.innerHTML = '<svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 1L1 6.5 7 12"/></svg>';
    r.appendChild(ch);
  }
  r.onclick = onClick;
  return r;
}

/* ---------- GEAR ---------- */
function viewGear(v){
  v.appendChild(el('h1','page-title','ציוד'));
  v.appendChild(el('p','page-sub', `${S.items.length} פריטים במערכת`));

  v.appendChild(searchBox('חפש פריט, קטגוריה או מספר סידורי'));

  const cats = categories();
  if (cats.length > 1) {
    const c = el('div','chips');
    cats.forEach(k => {
      const b = el('button','chip' + (S.cat === k ? ' on' : ''), k);
      b.onclick = () => { S.cat = k; render(); };
      c.appendChild(b);
    });
    v.appendChild(c);

  if (!list.length) {
    v.appendChild(emptyState(S.items.length ? 'אין תוצאות' : 'המחסן ריק',

      'הוסף פריט', () => itemSheet()));

    list.forEach(i => { (groups[i.category || 'ללא קטגוריה'] ||= []).push(i); });

         .forEach(i => v.appendChild(itemRow(i, () => itemSheet(i))));

function searchBox(ph){
  const w = el('div','search');
  w.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  const inp = el('input','input');
  inp.type = 'search'; inp.placeholder = ph; inp.value = S.q;
  inp.oninput = e => {
    S.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const again = document.querySelector('.search input');
    if (again) { again.focus(); again.setSelectionRange(pos,pos); }
  };
  w.appendChild(inp);
  return w;
}

function filtered(){
  const q = key(S.q);
  return S.items.filter(i => {
    if (S.cat !== 'הכל' && i.category !== S.cat) return false;
    if (!q) return true;
    return key(i.name).includes(q) || key(i.category).includes(q) || key(i.serial).includes(q);
  });
}

function fab(label, fn, cls){
  const bar = $('#fabBar');

/* ---------- CHECK OUT ---------- */
function viewOut(v){
  v.appendChild(el('h1','page-title','הוצאת ציוד'));
  v.appendChild(el('p','page-sub','מי לוקח, ומה.'));

  /* --- person --- */
  v.appendChild(el('div','sec-label','מי לוקח'));
  const f = el('div','field ac');
  const inp = el('input','input');
  inp.placeholder = 'שם מלא';
  inp.value = S.person ? S.person.name : (S._nameDraft || '');
  inp.autocomplete = 'off';
  const listBox = el('div','ac-list hide');

  const refreshAC = () => {
    const q = key(inp.value);
    listBox.innerHTML = '';
    if (!q) { listBox.classList.add('hide'); return; }
    const hits = S.people
      .filter(p => key(p.name).includes(q))
      .sort((a,b) => a.name.localeCompare(b.name,'he'))
      .slice(0,6);
    hits.forEach(p => {
      const n = outItems().filter(i => i.holderId === p.id).length;
      const b = el('button');
      b.innerHTML = `${esc(p.name)}${n ? `<span class="cnt">${n} בחוץ</span>` : ''}`;
      b.onclick = () => { S.person = p; S._nameDraft = ''; render(); };
      listBox.appendChild(b);
    });
    const exact = S.people.some(p => key(p.name) === q);
    if (!exact && norm(inp.value).length > 1) {
      const b = el('button','new', `+ הוסף "${norm(inp.value)}" כאדם חדש`);
      b.onclick = async () => {
        const p = await ensurePerson(inp.value);
        S.person = p; S._nameDraft = ''; render();
      };
      listBox.appendChild(b);
    }
    listBox.classList.toggle('hide', !listBox.children.length);
  };

  if (S.person) {
    inp.readOnly = true;
    inp.style.fontWeight = '700';
    const clear = el('button','btn ghost btn-sm','החלף אדם');
    clear.onclick = () => { S.person = null; S._nameDraft=''; render(); };
    f.append(inp, clear);
  } else {
    inp.oninput = e => { S._nameDraft = e.target.value; refreshAC(); };
    f.append(inp, listBox);
  }
  v.appendChild(f);
  if (!S.person) { setTimeout(() => { if (S._nameDraft) refreshAC(); }, 0); }

  if (!S.person) return;

  /* --- kits --- */
  const kits = S.kits.filter(k => (k.itemIds||[]).length);
  if (kits.length) {
    v.appendChild(el('div','sec-label','ערכות'));
    kits.forEach(k => {
      const members = (k.itemIds||[]).map(id => S.items.find(i => i.id === id)).filter(Boolean);
      const free = members.filter(i => i.kind === 'consumable' ? (i.qtyAvailable??0) > 0 : i.status === 'available');
      const r = el('button','row');
      r.innerHTML = `<span class="status-dot ${free.length === members.length ? 'sd-available' : 'sd-out'}"></span>
        <div class="r-main"><div class="r-name">${esc(k.name)}</div>
        <div class="r-meta"><span>${free.length} מתוך ${members.length} זמינים</span></div></div>`;
      const c = el('div','check');
      c.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>';
      r.appendChild(c);
      r.onclick = () => {
        free.forEach(i => { S.pick.add(i.id); S.qty[i.id] ||= 1; });
        toast(`נוספו ${free.length} פריטים מהערכה`);
        render();
      };
      v.appendChild(r);
    });
  }

  /* --- items --- */
  v.appendChild(el('div','sec-label','בחר ציוד'));
  v.appendChild(searchBox('חפש פריט'));

  const avail = filtered().filter(i => i.kind === 'consumable' ? (i.qtyAvailable ?? 0) > 0 : i.status === 'available');
  if (!avail.length) {
    v.appendChild(emptyState('אין ציוד זמין', 'כל הפריטים המתאימים נמצאים בחוץ או בתיקון.'));
  } else {
    const groups = {};
    avail.forEach(i => { (groups[i.category || 'ללא קטגוריה'] ||= []).push(i); });
    Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],'he')).forEach(([cat, arr]) => {
      v.appendChild(el('div','sec-label', cat));
      arr.sort((a,b)=>a.name.localeCompare(b.name,'he')).forEach(i => {
        const picked = S.pick.has(i.id);
        const r = itemRow(i, () => {
          if (picked) { S.pick.delete(i.id); delete S.qty[i.id]; }
          else { S.pick.add(i.id); S.qty[i.id] = 1; }
          render();
        }, { checkbox:true, picked });
        v.appendChild(r);

        if (picked && i.kind === 'consumable') {
          const q = el('div');
          q.style.cssText = 'display:flex;align-items:center;gap:10px;margin:-2px 0 10px;padding:0 14px';
          q.innerHTML = `<span style="font-size:13.5px;color:var(--dim);font-weight:600">כמות</span>`;
          const minus = el('button','btn ghost btn-sm','−'); minus.style.width='44px';
          const num = el('span','mono'); num.style.cssText='font-size:17px;font-weight:700;min-width:34px;text-align:center';
          num.textContent = S.qty[i.id];
          const plus = el('button','btn ghost btn-sm','+'); plus.style.width='44px';
          minus.onclick = e => { e.stopPropagation(); S.qty[i.id] = Math.max(1, S.qty[i.id]-1); render(); };
          plus.onclick  = e => { e.stopPropagation(); S.qty[i.id] = Math.min(i.qtyAvailable ?? 1, S.qty[i.id]+1); render(); };
          q.append(minus, num, plus);
          v.appendChild(q);
        }
      });
    });
  }

  if (S.pick.size) {
    fab(`המשך להחתמה · ${S.pick.size} פריטים`, () => {
      if (!S.operator) { toast('קודם תגיד מי מחתים', true); operatorSheet(); return; }
      const lines = [...S.pick].map(id => {
        const it = S.items.find(x => x.id === id);
        return { id, name: it ? it.name : '—', qty: S.qty[id] || 1 };
      });
      signSheet(S.person, lines, async (sig, note) => {
        const names = await checkout(S.person, [...S.pick], S.qty, note, sig);
        closeSheet();
        toast(`${S.person.name} חתם על ${names.length} פריטים`);
        S.pick.clear(); S.qty = {}; S.person = null; S.note = ''; S.q = '';
        S.tab = 'board'; window.scrollTo(0,0); render();
      });
    }, 'amber');
  }
}

/* ---------- RETURN ---------- */
function viewBack(v){
  v.appendChild(el('h1','page-title','החזרת ציוד'));
  const out = outItems();
  v.appendChild(el('p','page-sub', out.length ? `${out.length} פריטים בחוץ` : 'אין ציוד בחוץ'));

  const consum = S.items.filter(i => i.kind === 'consumable' && (i.qtyAvailable ?? 0) < (i.qtyTotal ?? 0));

  if (!out.length && !consum.length) {
    v.appendChild(emptyState('הכול חזר', 'אין כרגע ציוד שממתין להחזרה.'));
    return;
  }

  const byPerson = {};
  out.forEach(i => { (byPerson[i.holderName || 'לא ידוע'] ||= []).push(i); });

  Object.entries(byPerson).sort((a,b) => b[1].length - a[1].length).forEach(([who, list]) => {
    const head = el('button','sec-label');
    head.style.cssText = 'width:100%;text-align:start';
    head.textContent = `${who} · ${list.length}`;
    head.onclick = () => personSheet(who);
    v.appendChild(head);
    list.forEach(i => {
      const picked = S.pick.has(i.id);
      v.appendChild(itemRow(i, () => {
        picked ? S.pick.delete(i.id) : S.pick.add(i.id);
        render();
      }, { checkbox:true, picked }));
    });
    const all = el('button','btn ghost btn-sm', list.every(i => S.pick.has(i.id)) ? 'בטל בחירה' : 'בחר הכול');
    all.style.marginBottom = '4px';
    all.onclick = () => {
      const every = list.every(i => S.pick.has(i.id));
      list.forEach(i => every ? S.pick.delete(i.id) : S.pick.add(i.id));
      render();
    };
    v.appendChild(all);
  });

  if (consum.length) {
    v.appendChild(el('div','sec-label','מתכלים — החזרת עודפים'));
    consum.forEach(i => {
      const picked = S.pick.has(i.id);
      v.appendChild(itemRow(i, () => {
        if (picked) { S.pick.delete(i.id); delete S.qty[i.id]; }
        else { S.pick.add(i.id); S.qty[i.id] = 1; }
        render();
      }, { checkbox:true, picked }));
    });
  }

  if (S.pick.size) {
    const b = fab(`זכה והחזר · ${S.pick.size}`, async () => {
      if (!S.operator) { toast('קודם תגיד מי מחתים', true); operatorSheet(); return; }
      b.disabled = true; b.textContent = 'מעדכן…';
      try {
        await returnItems([...S.pick], S.qty, '');
        toast(`${S.pick.size} פריטים חזרו למחסן`);
        S.pick.clear(); S.qty = {}; S.tab = 'board'; window.scrollTo(0,0); render();
      } catch(e){ b.disabled = false; toast('העדכון נכשל — נסה שוב', true); render(); }
    }, 'green');
  }
}

/* ---------- LOG ---------- */
function viewLog(v){
  v.appendChild(el('h1','page-title','יומן'));
  v.appendChild(el('p','page-sub','כל תנועה שנרשמה. לא ניתן למחיקה.'));

  const people = [...new Set(S.txns.map(t => t.personName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'he'));
  if (people.length) {
    const c = el('div','chips');
    const allB = el('button','chip' + (!S.logFilter ? ' on' : ''), 'הכול');
    allB.onclick = () => { S.logFilter = null; render(); };
    c.appendChild(allB);
    people.forEach(p => {
      const b = el('button','chip' + (S.logFilter === p ? ' on' : ''), p);
      b.onclick = () => { S.logFilter = S.logFilter === p ? null : p; render(); };
      c.appendChild(b);
    });
    v.appendChild(c);
  }

  const rows = S.txns.filter(t => !S.logFilter || t.personName === S.logFilter);
  if (!rows.length) { v.appendChild(emptyState('היומן ריק','כל הוצאה והחזרה יופיעו כאן אוטומטית.')); return; }

  let lastDay = null;
  rows.forEach(t => {
    const d = ts(t.at);
    const dayKey = d ? d.toDateString() : '—';
    if (dayKey !== lastDay) { lastDay = dayKey; v.appendChild(el('div','log-day', fmtDay(d))); }

    const g = el('div','log');
    const ic = el('div','ic ' + t.action);
    ic.textContent = { checkout:'↑', return:'↓', repair:'!', adjust:'±' }[t.action] || '·';
    const main = el('div','l-main');
    const verb = { checkout:'הוציא', return:'הוחזר', repair:'סומן כתקלה', adjust:'עדכון מלאי' }[t.action] || t.action;
    let line;
    if (t.action === 'checkout')      line = `<b>${esc(t.personName)}</b> הוציא ${esc(t.itemName)}${t.qty > 1 ? ` ×${t.qty}` : ''}`;
    else if (t.action === 'return')   line = `${esc(t.itemName)}${t.qty > 1 ? ` ×${t.qty}` : ''} הוחזר${t.personName ? ` ע"י <b>${esc(t.personName)}</b>` : ''}`;
    else if (t.action === 'adjust')   line = `${esc(t.itemName)} — מלאי ${t.qty > 0 ? '+' : ''}${t.qty}`;
    else                              line = `${esc(t.itemName)} — ${verb}`;
    main.innerHTML = `<div class="l-t">${line}</div><div class="l-time mono">${fmtTime(d)}${t.operator ? ` · ${esc(t.operator)}` : ''}</div>` +
                     (t.note ? `<div class="l-note">${esc(t.note)}</div>` : '');
    g.append(ic, main);
    v.appendChild(g);
  });
}

/* Everything one person is accountable for, plus the forms they signed. */
function personSheet(name){
  openSheet(sh => {
    const held = S.items.filter(i => i.kind !== 'consumable' && i.status === 'out' && i.holderName === name);
    sh.appendChild(el('h2','sheet-title', name));
    sh.appendChild(el('p','sheet-sub', held.length ? `${held.length} פריטים באחריותו` : 'אין ציוד באחריותו'));

    if (held.length) {
      held.forEach(i => sh.appendChild(itemRow(i, () => { closeSheet(); setTimeout(()=>itemSheet(i),260); })));
      const b = el('button','btn green','זכה על הכול');
      b.style.marginTop = '6px';
      b.onclick = async () => {
        if (!S.operator) { toast('קודם תגיד מי מחתים', true); return; }
        b.disabled = true; b.textContent = 'מעדכן…';
        try {
          await returnItems(held.map(i => i.id), {}, '');
          closeSheet(); toast(`${held.length} פריטים חזרו מ${name}`);
        } catch(e){ b.disabled = false; b.textContent = 'נסה שוב'; toast('העדכון נכשל', true); }
      };
      sh.appendChild(b);
    }

    const recs = S.receipts.filter(r => r.personName === name).slice(0,10);
    if (recs.length) {
      sh.appendChild(el('div','sec-label','טפסים חתומים'));
      recs.forEach(r => {
        const d = ts(r.at);
        const box = el('div','receipt');
        const head = el('div','r-head');
        head.innerHTML = `<b>${(r.lines||[]).length} פריטים</b>
          <span style="font-size:12.5px;color:var(--dim)">${r.operator ? 'החתים: ' + esc(r.operator) : ''}</span>
          <span class="when">${fmtDay(d)} ${fmtTime(d)}</span>`;
        box.appendChild(head);
        const ul = el('ul');
        (r.lines||[]).forEach(l => ul.appendChild(el('li', null, l.qty > 1 ? `${l.name} ×${l.qty}` : l.name)));
        box.appendChild(ul);
        if (r.note) { const n = el('div'); n.style.cssText='font-size:13px;color:var(--dim);font-style:italic;margin-top:6px'; n.textContent = r.note; box.appendChild(n); }
        if (r.signature) { const im = new Image(); im.src = r.signature; im.alt = 'חתימה'; box.appendChild(im); }
        sh.appendChild(box);
      });
    }
  });
}

/* ============================================================
   SIGNATURE PAD
   Finger-drawn on canvas, trimmed to its ink bounds, downscaled
   and stored as a compressed PNG data URL on the receipt.
   ============================================================ */
function signaturePad(host){
  const wrap = el('div','sigwrap');
  const cv = document.createElement('canvas');
  wrap.appendChild(cv);
  wrap.appendChild(el('div','baseline'));
  wrap.appendChild(el('div','hintline','חתום כאן באצבע'));
  host.appendChild(wrap);

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const fit = () => {
    const r = cv.getBoundingClientRect();
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    c.lineWidth = 2.4; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#16191A';
  };
  setTimeout(fit, 60);

  const ctx = () => cv.getContext('2d');
  let drawing = false, dirty = false;
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;

  const pt = e => {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const track = p => { minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); };

  const start = e => { e.preventDefault(); drawing = true; const p = pt(e); const c = ctx(); c.beginPath(); c.moveTo(p.x,p.y); track(p); };
  const move  = e => { if (!drawing) return; e.preventDefault(); const p = pt(e); const c = ctx(); c.lineTo(p.x,p.y); c.stroke(); track(p);
                       if (!dirty) { dirty = true; wrap.classList.add('signed'); host.dispatchEvent(new CustomEvent('sig:dirty')); } };
  const end   = () => { drawing = false; };

  cv.addEventListener('touchstart', start, {passive:false});
  cv.addEventListener('touchmove',  move,  {passive:false});
  cv.addEventListener('touchend',   end);
  cv.addEventListener('mousedown',  start);
  cv.addEventListener('mousemove',  move);
  window.addEventListener('mouseup', end);

  return {
    get signed(){ return dirty; },
    clear(){
      ctx().clearRect(0,0,cv.width,cv.height);
      dirty = false; minX=1e9; minY=1e9; maxX=-1e9; maxY=-1e9;
      wrap.classList.remove('signed');
      host.dispatchEvent(new CustomEvent('sig:dirty'));
    },
    /* Trim to ink, cap at 520px wide — keeps a receipt well under
       Firestore's 1 MB document limit even with a busy signature. */
    toDataURL(){
      if (!dirty) return '';
      const pad = 10;
      const sx = Math.max(0,(minX-pad))*dpr, sy = Math.max(0,(minY-pad))*dpr;
      const sw = Math.min(cv.width - sx, (maxX-minX+pad*2)*dpr);
      const sh = Math.min(cv.height - sy, (maxY-minY+pad*2)*dpr);
      const scale = Math.min(1, 520 / sw);
      const out = document.createElement('canvas');
      out.width = Math.max(1, Math.round(sw*scale));
      out.height = Math.max(1, Math.round(sh*scale));
      const oc = out.getContext('2d');
      oc.fillStyle = '#FFFFFF'; oc.fillRect(0,0,out.width,out.height);
      oc.drawImage(cv, sx, sy, sw, sh, 0, 0, out.width, out.height);
      return out.toDataURL('image/png');
    }
  };
}

/* The signing sheet — the moment responsibility transfers. */
function signSheet(person, lines, onConfirm){
  openSheet(sh => {
    sh.appendChild(el('h2','sheet-title','טופס החתמה'));
    sh.appendChild(el('p','sheet-sub',
      `${person.name} מקבל ${lines.length} פריטים · מחתים: ${S.operator || '—'}`));

    const box = el('div','receipt');
    const ul = el('ul');
    lines.forEach(l => ul.appendChild(el('li', null, l.qty > 1 ? `${l.name} ×${l.qty}` : l.name)));
    box.appendChild(ul);
    sh.appendChild(box);

    const nf = el('div','field');
    nf.appendChild(el('label',null,'הערה (לא חובה)'));
    const nI = el('input','input'); nI.placeholder = 'למשל: לצילום ביום ראשון';
    nf.appendChild(nI); sh.appendChild(nf);

    sh.appendChild(el('div','sec-label','חתימת המקבל'));
    const host = el('div');
    sh.appendChild(host);
    const pad = signaturePad(host);

    const clr = el('button','btn ghost btn-sm','נקה חתימה');
    clr.onclick = () => pad.clear();
    sh.appendChild(clr);

    const go = el('button','btn amber','אשר החתמה');
    go.style.marginTop = '10px';
    go.disabled = true;
    host.addEventListener('sig:dirty', () => { go.disabled = !pad.signed; });
    go.onclick = async () => {
      if (!pad.signed) { toast('צריך חתימה', true); return; }
      go.disabled = true; go.textContent = 'רושם…';
      try { await onConfirm(pad.toDataURL(), norm(nI.value)); }
      catch(e){ go.disabled = false; go.textContent = 'נסה שוב';
                toast(e.blocked ? e.message : 'הרישום נכשל', true); }
    };
    sh.appendChild(go);
  });
}

/* ============================================================
   ITEM SHEET — create / edit / act
   ============================================================ */
function itemSheet(item){
  const isNew = !item;
  openSheet(sh => {
    sh.appendChild(el('h2','sheet-title', isNew ? 'פריט חדש' : item.name));
    if (!isNew) sh.appendChild(el('p','sheet-sub',
      item.status === 'out' ? `אצל ${item.holderName || '—'} · ${daysSince(ts(item.checkedOutAt))} ימים` : statusLabel(item)));

    const mk = (label, value, ph, type='text') => {
      const f = el('div','field');
      f.appendChild(el('label', null, label));
      const i = el('input','input');
      i.type = type; i.value = value ?? ''; i.placeholder = ph || '';
      f.appendChild(i); sh.appendChild(f);
      return i;
    };

    const nameI = mk('שם הפריט', item?.name, 'למשל: Sony FX3 — גוף 2');
    const catI  = mk('קטגוריה', item?.category, 'מצלמות / עדשות / תאורה / אודיו');
    catI.setAttribute('list','catlist');
    const dl = el('datalist'); dl.id = 'catlist';
    categories().filter(c => c !== 'הכל').forEach(c => { const o = el('option'); o.value = c; dl.appendChild(o); });
    sh.appendChild(dl);

    /* kind toggle */
    const kf = el('div','field');
    kf.appendChild(el('label',null,'סוג'));
    const kc = el('div','chips');
    let kind = item?.kind || 'unique';
    [['unique','פריט בודד'],['consumable','מתכלה (לפי כמות)']].forEach(([k,l]) => {
      const b = el('button','chip' + (kind === k ? ' on' : ''), l);
      b.onclick = () => { kind = k; [...kc.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); qWrap.classList.toggle('hide', kind !== 'consumable'); serWrap.classList.toggle('hide', kind === 'consumable'); };
      kc.appendChild(b);
    });
    kf.appendChild(kc); sh.appendChild(kf);

    const serWrap = el('div');
    sh.appendChild(serWrap);
    const serF = el('div','field');
    serF.appendChild(el('label',null,'מספר סידורי (לא חובה)'));
    const serI = el('input','input'); serI.value = item?.serial || ''; serI.placeholder='S/N'; serI.style.direction='ltr'; serI.style.textAlign='left';
    serF.appendChild(serI); serWrap.appendChild(serF);
    serWrap.classList.toggle('hide', kind === 'consumable');

    const qWrap = el('div');
    sh.appendChild(qWrap);
    const qF = el('div','field');
    qF.appendChild(el('label',null,'כמות במלאי'));
    const qI = el('input','input'); qI.type='number'; qI.min='0'; qI.value = item?.qtyTotal ?? 10;
    qF.appendChild(qI); qWrap.appendChild(qF);
    qWrap.classList.toggle('hide', kind !== 'consumable');

    const save = el('button','btn', isNew ? 'הוסף למחסן' : 'שמור שינויים');
    save.onclick = async () => {
      const n = norm(nameI.value);
      if (!n) { toast('צריך שם לפריט', true); nameI.focus(); return; }
      save.disabled = true; save.textContent = 'שומר…';
      const data = {
        name:n, category: norm(catI.value) || 'ללא קטגוריה', kind,
        serial: kind === 'consumable' ? '' : norm(serI.value),
      };
      try {
        if (kind === 'consumable') {
          const total = Math.max(0, parseInt(qI.value || '0', 10));
          if (isNew) { data.qtyTotal = total; data.qtyAvailable = total; data.status = 'available'; }
          else {
            const diff = total - (item.qtyTotal ?? 0);
            data.qtyTotal = total;
            data.qtyAvailable = Math.max(0, (item.qtyAvailable ?? 0) + diff);
          }
        } else if (isNew) {
          data.status = 'available'; data.holderId = null; data.holderName = null;
        }
        if (isNew) { data.createdAt = serverTimestamp(); await addDoc(collection(S.db,'items'), data); }
        else await updateDoc(doc(S.db,'items',item.id), data);
        closeSheet(); toast(isNew ? 'הפריט נוסף' : 'עודכן');
      } catch(e){ save.disabled = false; save.textContent = 'נסה שוב'; toast('השמירה נכשלה', true); }
    };
    sh.appendChild(save);

    if (!isNew) {
      const row = el('div','btn-row');
      if (item.kind !== 'consumable') {
        if (item.status === 'out') {
          const b = el('button','btn green btn-sm','החזר עכשיו');
          b.onclick = async () => { await returnItems([item.id], {}, ''); closeSheet(); toast('הפריט חזר'); };
          row.appendChild(b);
        }
        const rb = el('button','btn ghost btn-sm', item.status === 'repair' ? 'החזר לשירות' : 'סמן כתקלה');
        rb.onclick = async () => {
          await markStatus(item, item.status === 'repair' ? 'available' : 'repair', '');
          closeSheet(); toast(item.status === 'repair' ? 'חזר לשירות' : 'סומן כתקלה');
        };
        row.appendChild(rb);
      } else {
        const p = el('button','btn ghost btn-sm','+10 למלאי');
        p.onclick = async () => { await restock(item, 10, ''); closeSheet(); toast('המלאי עודכן'); };
        row.appendChild(p);
      }
      sh.appendChild(row);

      const del = el('button','btn danger btn-sm','מחק פריט');
      del.style.marginTop = '8px';
      del.onclick = async () => {
        if (!confirm(`למחוק את "${item.name}"? היומן יישמר.`)) return;
        await deleteDoc(doc(S.db,'items',item.id));
        closeSheet(); toast('נמחק');
      };
      sh.appendChild(del);

      const hist = S.txns.filter(t => t.itemId === item.id).slice(0,8);
      if (hist.length) {
        sh.appendChild(el('div','sec-label','היסטוריה'));
        hist.forEach(t => {
          const d = ts(t.at);
          const g = el('div','log');
          const ic = el('div','ic ' + t.action);
          ic.textContent = { checkout:'↑', return:'↓', repair:'!', adjust:'±' }[t.action] || '·';
          const m = el('div','l-main');
          m.innerHTML = `<div class="l-t">${t.action==='checkout'?'הוצא ע"י ':'הוחזר '}<b>${esc(t.personName||'')}</b></div>
                         <div class="l-time mono">${fmtDay(d)} · ${fmtTime(d)}</div>`;
          g.append(ic,m); sh.appendChild(g);
        });
      }
    }
  });
}

boot();
</script>
